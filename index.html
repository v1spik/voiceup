<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>voiceup</title>
    <meta name="description" content="P2P voice room and chat application inspired by Discord." />
    <meta property="og:title" content="voiceup" />
    <meta property="og:description" content="P2P voice room and chat application inspired by Discord." />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --bg: #000000; 
            --bg-secondary: #111111; 
            --text-main: #ffffff; 
            --text-muted: #888888; 
            --button-bg: #1c1c1c; 
            --button-hover: #2a2a2a; 
            --success: #50fa7b; 
            --warning: #f1fa8c;
            --danger: #ff5555; 
            --border-color: #282828;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; font-weight: 400; }
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            position: relative; 
        }
        .app-name { position: absolute; top: 20px; font-size: 15px; font-weight: 700; letter-spacing: 2px; text-transform: lowercase; color: var(--text-muted); }
        
        #profile-btn { position: absolute; top: 16px; left: 16px; width: 34px; height: 34px; border-radius: 50%; background-color: var(--button-bg); border: 1px solid var(--border-color); color: var(--text-muted); display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 200; transition: 0.2s; overflow: hidden; }
        #profile-btn:hover { border-color: #555; color: var(--text-main); }
        #profile-btn img { width: 100%; height: 100%; object-fit: cover; }
        
        .lang-switch { position: absolute; top: 20px; right: 20px; font-size: 12px; color: var(--text-muted); z-index: 200; user-select: none; }
        .lang-switch span { cursor: pointer; transition: color 0.2s; }
        .lang-switch span.active { color: var(--text-main); font-weight: 500; }

        /* Шапка голосовой комнаты */
        #room-header {
            position: absolute;
            top: 16px;
            display: none;
            align-items: center;
            gap: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 24px;
            z-index: 150;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }
        .room-title-box { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .room-hash { color: var(--text-muted); font-weight: 700; }
        #room-header-name { font-weight: 500; color: var(--text-main); text-transform: lowercase; }
        .role-badge { font-size: 10px; padding: 2px 6px; border-radius: 8px; font-weight: 500; text-transform: lowercase; }
        .role-badge.host { background: rgba(80, 250, 123, 0.12); color: var(--success); border: 1px solid rgba(80, 250, 123, 0.25); }
        .role-badge.guest { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid #333; }
        
        /* Таймер длительности сессии */
        .session-timer {
            font-size: 11px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.4px;
            padding-left: 7px;
            margin-left: 1px;
            border-left: 1px solid var(--border-color);
            line-height: 1;
            user-select: none;
        }

        .header-btn {
            background: var(--button-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 14px;
            padding: 4px 9px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
        }
        .header-btn:hover { color: var(--text-main); border-color: #555; background: var(--button-hover); }
        .header-btn svg { width: 12px; height: 12px; }
        .header-btn.active { color: var(--success); border-color: rgba(80, 250, 123, 0.4); }

        #room-screen { 
            flex: 1; 
            padding: 20px; 
            padding-top: 80px;
            padding-bottom: 120px; 
            display: flex; 
            flex-wrap: wrap; 
            align-content: center; 
            align-items: center; 
            gap: 18px; 
            justify-content: center; 
            opacity: 0; 
            transition: opacity 0.3s ease; 
            overflow-y: auto; 
            height: 100%; 
            width: 100%;
            -webkit-overflow-scrolling: touch;
        }

        #join-screen { 
            position: absolute; 
            background: var(--bg); 
            padding: 24px; 
            text-align: center; 
            z-index: 100; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            width: 100%; 
            max-width: 380px; 
        }
        h1 { font-size: 24px; font-weight: 500; text-transform: lowercase; letter-spacing: -0.5px; }

        input[type="text"] { 
            background-color: var(--bg-secondary); 
            color: var(--text-main); 
            border: 1px solid var(--border-color); 
            padding: 13px; 
            font-size: 14px; 
            border-radius: 6px; 
            width: 100%; 
            outline: none; 
            text-align: center; 
            transition: border-color 0.2s; 
        }
        input[type="text"]:focus { border-color: #555; }
        
        button.primary-btn { 
            background-color: var(--button-bg); 
            color: var(--text-main); 
            border: 1px solid #333; 
            padding: 13px 0; 
            font-size: 14px; 
            font-weight: 500; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: 0.2s; 
            text-transform: lowercase; 
            width: 100%; 
        }
        button.primary-btn:hover { background-color: var(--button-hover); border-color: #555; }
        
        button.secondary-btn { 
            background-color: transparent; 
            color: var(--text-muted); 
            border: 1px solid var(--border-color); 
            padding: 11px 0; 
            font-size: 12px; 
            font-weight: 500; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: 0.2s; 
            text-transform: lowercase; 
            width: 100%; 
        }
        button.secondary-btn:hover { color: var(--text-main); border-color: #555; }

        /* Слоты закрепленных комнат */
        #pinned-rooms-section {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            text-align: left;
        }
        .pinned-rooms-title {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pinned-list { display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; }
        .pinned-room-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            text-align: left;
        }
        .pinned-room-btn:hover {
            border-color: #444;
            background: var(--button-hover);
        }
        .pinned-room-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-main); }
        .pinned-room-del { color: var(--text-muted); padding: 2px 6px; font-size: 14px; }
        .pinned-room-del:hover { color: var(--danger); }

        /* Карточка пользователя */
        .user-card { 
            background-color: transparent; 
            width: 140px; 
            height: 150px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            border: none; 
            animation: popIn 0.3s ease; 
            position: relative; 
        }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        
        .avatar { 
            width: 58px; 
            height: 58px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px; 
            font-weight: 700; 
            background-color: var(--button-bg); 
            margin-bottom: 8px; 
            text-transform: lowercase; 
            overflow: hidden; 
            border: 2px solid var(--border-color); 
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; 
        }
        .avatar.speaking { 
            transform: scale(1.06); 
            box-shadow: 0 0 0 3px var(--success); 
            border-color: var(--success) !important; 
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .user-name { 
            font-size: 13px; 
            font-weight: 500; 
            text-transform: lowercase; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 4px; 
            max-width: 130px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .nick-text { overflow: hidden; text-overflow: ellipsis; }

        /* Индикатор устройства и качества связи */
        .user-status { 
            font-size: 11px; 
            color: var(--text-muted); 
            margin-top: 3px; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            text-transform: lowercase; 
            height: 16px; 
        }
        
        .status-device-indicator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 13px;
            height: 13px;
            color: var(--success);
        }
        .status-device-indicator svg {
            width: 12px;
            height: 12px;
            display: block;
        }

        /* МИНИМАЛИСТИЧНЫЙ ИНДИКАТОР КАЧЕСТВА СВЯЗИ (3 вертикальные полоски: 3px, 6px, 9px) */
        .net-quality {
            display: inline-flex;
            align-items: flex-end;
            gap: 1.5px;
            height: 9px;
            margin-left: 1px;
            flex-shrink: 0;
        }
        .net-bar {
            width: 2px;
            background-color: #333333;
            border-radius: 1px;
            transition: background-color 0.25s ease;
        }
        .net-bar.b1 { height: 3px; }
        .net-bar.b2 { height: 6px; }
        .net-bar.b3 { height: 9px; }

        .net-quality.good .net-bar.b1,
        .net-quality.good .net-bar.b2,
        .net-quality.good .net-bar.b3 {
            background-color: var(--success);
        }
        .net-quality.medium .net-bar.b1,
        .net-quality.medium .net-bar.b2 {
            background-color: var(--warning);
        }
        .net-quality.bad .net-bar.b1 {
            background-color: var(--danger);
        }

        .status-icons { display: flex; gap: 4px; margin-left: 3px; }
        .status-icons svg { width: 13px; height: 13px; color: var(--danger); }
        
        .card-menu-btn { position: absolute; top: 4px; right: 4px; background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-muted); width: 24px; height: 24px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; z-index: 10; }
        .user-card:hover .card-menu-btn { opacity: 1; }
        .card-menu-btn:hover { color: var(--text-main); border-color: #555; }
        
        .card-dropdown { position: absolute; top: 32px; right: 4px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; display: none; flex-direction: column; gap: 8px; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,0.8); min-width: 150px; text-align: left; }
        .card-dropdown.open { display: flex; }
        
        .local-controls { display: flex; align-items: center; gap: 8px; width: 100%; }
        .admin-controls { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border-color); padding-top: 8px; }
        .admin-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); padding: 5px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: 0.2s; text-transform: lowercase; text-align: left; }
        .admin-btn:hover { color: var(--text-main); border-color: #555; background: rgba(255,255,255,0.05); }
        .admin-btn.danger:hover { color: var(--danger); border-color: var(--danger); }
        
        .loc-mute-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
        .loc-mute-btn:hover { color: var(--text-main); }
        .loc-mute-btn.muted { color: var(--danger); }
        .loc-mute-btn svg { width: 16px; height: 16px; }
        
        .loc-vol { -webkit-appearance: none; flex: 1; height: 4px; background: var(--border-color); border-radius: 2px; outline: none; cursor: pointer; }
        .loc-vol::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); }
        
        /* Нижняя панель */
        #controls-panel { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; padding: 6px 8px; gap: 8px; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.6); align-items: center; }
        .icon-btn { width: 40px; height: 40px; border-radius: 6px; background-color: var(--button-bg); border: none; color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; position: relative; }
        .icon-btn:hover { background-color: var(--button-hover); }
        .icon-btn svg { width: 20px; height: 20px; stroke-width: 2; }
        .icon-btn.off { color: var(--danger); background-color: rgba(255, 85, 85, 0.1); }
        .icon-btn.off::after { content: ''; position: absolute; width: 2px; height: 24px; background-color: var(--danger); transform: rotate(45deg); border-radius: 2px; box-shadow: 0 0 0 2px var(--bg-secondary); }
        
        .icon-group { display: flex; background-color: var(--button-bg); border-radius: 6px; overflow: hidden; }
        .icon-group .icon-btn { border-radius: 0; background-color: transparent; }
        .icon-group .icon-btn:hover { background-color: rgba(255,255,255,0.05); }
        .icon-group .icon-btn.off { background-color: rgba(255, 85, 85, 0.1); }
        
        .leave-btn { background-color: var(--danger); color: var(--text-main); }
        .leave-btn:hover { background-color: #ff3333; }
        
        .hotkey-btn { background-color: transparent; color: var(--text-muted); border: none; border-left: 1px solid var(--border-color); padding: 0 8px; font-size: 11px; font-weight: 500; cursor: pointer; transition: color 0.2s; min-width: 32px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
        .hotkey-btn:hover { color: var(--text-main); }
        .hotkey-btn.listening { color: var(--success); }
        .hotkey-btn svg { width: 14px; height: 14px; stroke-width: 2; }
        .cancel-hk { width: 12px; height: 12px; margin-left: 4px; color: var(--text-muted); display: inline-block; }
        .cancel-hk:hover { color: var(--danger); }
        
        #chat-badge { position: absolute; top: -2px; right: -2px; width: 9px; height: 9px; background-color: var(--danger); border-radius: 50%; display: none; box-shadow: 0 0 0 2px var(--bg-secondary); }

        /* QR Код модалка */
        #qr-modal { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 500; }
        .qr-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; box-shadow: 0 16px 40px rgba(0,0,0,0.8); position: relative; max-width: 280px; width: 90vw; }
        .qr-close-btn { position: absolute; top: 8px; right: 10px; background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; line-height: 1; }
        .qr-close-btn:hover { color: var(--text-main); }
        .qr-box { background: #ffffff; padding: 10px; border-radius: 8px; display: flex; justify-content: center; align-items: center; }
        .qr-room-text { font-size: 13px; color: var(--text-muted); text-transform: lowercase; }

        /* Модалка профиля */
        #profile-modal { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; z-index: 300; }
        .modal-content { background: var(--bg); border: 1px solid var(--border-color); padding: 24px; border-radius: 8px; width: 290px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .avatar-upload { width: 72px; height: 72px; border-radius: 50%; background-color: var(--bg-secondary); border: 1px dashed #444; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; }
        .avatar-upload img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-upload span { font-size: 11px; color: var(--text-muted); position: absolute; }
        #avatarInput { display: none; }
        #removeAvatarBtn { color: var(--danger); font-size: 11px; cursor: pointer; margin-top: -6px; display: none; }
        #removeAvatarBtn:hover { text-decoration: underline; }
        input[type="color"] { -webkit-appearance: none; border: 1px solid var(--border-color); width: 100%; height: 36px; border-radius: 4px; cursor: pointer; padding: 0; background-color: var(--bg-secondary); }
        #resetProfileBtn { color: var(--text-muted); font-size: 11px; cursor: pointer; text-decoration: underline; margin-top: -4px; }
        #resetProfileBtn:hover { color: var(--danger); }
        .modal-buttons { display: flex; gap: 8px; width: 100%; }

        /* Чат */
        #chat-panel { position: absolute; inset: 0; z-index: 1000; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s; display: flex; justify-content: center; align-items: center; padding: 16px; padding-bottom: 85px; }
        #chat-panel.open { opacity: 1; visibility: visible; }
        .chat-inner { width: 100%; max-width: 660px; height: 100%; max-height: 80vh; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
        .chat-header { padding: 14px 18px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-weight: 500; background: #161616; font-size: 14px; }
        #close-chat { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; line-height: 1; }
        #close-chat:hover { color: var(--danger); }
        #chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { font-size: 13px; line-height: 1.4; word-wrap: break-word; }
        .chat-img { max-width: 100%; border-radius: 4px; margin-top: 4px; display: block; border: 1px solid #333; }
        .chat-file { display: inline-block; background: var(--button-bg); padding: 5px 8px; border-radius: 4px; color: var(--text-main); text-decoration: none; margin-top: 4px; font-size: 11px; border: 1px solid #333; }
        .chat-input-area { padding: 10px 16px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; align-items: center; }
        .chat-input-area input[type="text"] { flex: 1; padding: 10px; font-size: 13px; text-align: left; }
        #chat-attach-btn { cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; padding: 4px; }
        #chat-attach-btn svg { width: 18px; height: 18px; }
        #chat-send { background: var(--button-bg); border: 1px solid var(--border-color); color: var(--text-main); width: 38px; height: 38px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #chat-send svg { width: 16px; height: 16px; }
        
        #banned-screen { position: absolute; inset: 0; background: var(--bg); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; text-align: center; padding: 20px; }
        #admin-notifications { position: absolute; top: 70px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 2000; }
        .appeal-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); width: 260px; text-align: left; }
        
        #toast-notification {
            position: fixed;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text-main);
            color: var(--bg);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            z-index: 2500;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
        }
        #toast-notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Скроллинг и адаптивность на телефонах */
        @media (max-width: 768px) {
            body { 
                overflow-y: auto; 
                height: 100%; 
                min-height: 100vh;
                -webkit-overflow-scrolling: touch; 
            }
            .app-name { display: none; }
            #room-header {
                position: fixed;
                top: 10px;
                left: 10px;
                right: 10px;
                border-radius: 14px;
                padding: 8px 10px;
                flex-wrap: wrap;
                justify-content: space-between;
                gap: 6px;
            }
            .room-title-box { font-size: 12px; }
            .header-btn { font-size: 10px; padding: 4px 7px; }
            #profile-btn { top: auto; bottom: 20px; left: 16px; z-index: 120; }
            .lang-switch { top: auto; bottom: 25px; right: 16px; }
            
            #controls-panel {
                position: fixed;
                bottom: 16px;
                padding: 4px 6px;
                gap: 6px;
                border-radius: 8px;
            }
            .icon-btn { width: 38px; height: 38px; }
            .hotkey-btn { display: none; }
            
            #room-screen {
                padding-top: 110px;
                padding-bottom: 130px;
                gap: 14px;
                align-content: flex-start;
                min-height: 100vh;
            }

        function detectDeviceType() {

        // 3. ИКОНКИ ТИПОВ УСТРОЙСТВ И БРАУЗЕРА (SVG: Монитор ПК / Смартфон / Десктопное приложение .exe)
        function getStatusDotHtml(deviceType) {

            const titleText = peerId === myId ? '0 ms' : `${health.rtt || 30} ms`;

                <span class="net-bar b1"></span>
                <span class="net-bar b2"></span>
                <span class="net-bar b3"></span>
            </div>`;
        }

        function updateNetQualityDOM(peerId, quality, rtt) {
            if (!peerHealth[peerId]) {
                peerHealth[peerId] = { lastSeen: Date.now(), rtt: rtt || 35, quality: quality || 'good', reconnecting: false };
            } else {
                if (quality) peerHealth[peerId].quality = quality;
                if (typeof rtt === 'number') peerHealth[peerId].rtt = rtt;
            }
            const el = document.getElementById(`net-${peerId}`);
            if (el) {
                el.className = `net-quality ${peerHealth[peerId].quality}`;
                el.title = peerId === myId ? '0 ms' : `${peerHealth[peerId].rtt} ms`;
            }

        // АВТОГЕНЕРАЦИЯ УНИКАЛЬНЫХ ИМЕН КОМНАТ (vup-xxxx-xxxx)
        function generateUniqueRoomId() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            const block = () => {
                let s = '';
                for (let i = 0; i < 4; i++) {
                    s += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                return s;
            };
            return `vup-${block()}-${block()}`;
        }

        let activeRoom = urlParams.get('room') || window.location.hash.replace('#', '').trim();

            return name.replace(/[^a-zA-Z0-9_\-]/g, '').toLowerCase().substring(0, 28);

        let sessionStartTime = 0;

        function formatSessionDuration(totalSeconds) {
            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            const pad = (n) => String(n).padStart(2, '0');
            if (hrs > 0) {
                return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
            }
            return `${pad(mins)}:${pad(secs)}`;
        }

        function startSessionTimer() {
            stopSessionTimer();
            sessionStartTime = Date.now();
            roomSessionTimer.innerText = '00:00';
            sessionTimerInterval = setInterval(() => {
                const elapsedSec = Math.max(0, Math.floor((Date.now() - sessionStartTime) / 1000));
                roomSessionTimer.innerText = formatSessionDuration(elapsedSec);
            }, 1000);
        }

        function stopSessionTimer() {
            if (sessionTimerInterval) {
                clearInterval(sessionTimerInterval);
                sessionTimerInterval = null;
            }
            roomSessionTimer.innerText = '00:00';

            try {

            localStorage.setItem('voiceup_pinned_rooms', JSON.stringify(list.slice(0, MAX_PINNED_ROOMS)));

            updateRoomHeaderUI();

        function getCachedRoomPeers() {
            try {
                const raw = localStorage.getItem('voiceup_cached_peers_' + activeRoom);
                if (!raw) return [];
                const parsed = JSON.parse(raw);

        function updateCachedRoomPeers() {
            try {
                const peers = Object.keys(activeConnections).filter(id => id && id !== myId);
                if (myId) peers.push(myId);
                const unique = Array.from(new Set(peers)).slice(-12);
                localStorage.setItem('voiceup_cached_peers_' + activeRoom, JSON.stringify(unique));
            } catch (e) {}
        }

        function updateRoomHeaderUI() {
            roomHeaderName.innerText = activeRoom;
            const pinnedList = getPinnedRooms();
            const isPinned = pinnedList.includes(activeRoom);
            pinRoomBtn.classList.toggle('active', isPinned);
            pinBtnText.innerText = isPinned ? dict[currentLang].pinnedActive : dict[currentLang].pinBtn;

            // Статус "создатель" строго у ОДНОГО участника (currentHostId === myId)
            const amISingleHost = Boolean(myId && currentHostId === myId);
            isRoomHost = amISingleHost;
            myProfile.isAdmin = amISingleHost;

            if (amISingleHost) {
                roomRoleTag.className = 'role-badge host';
                roomRoleTag.innerText = dict[currentLang].host;
            } else {
                roomRoleTag.className = 'role-badge guest';
                roomRoleTag.innerText = dict[currentLang].guest;
            }
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let peer = null;
        let localStream = null;
        const activeConnections = {};
        const connectionAttemptTs = {};
        const activeCalls = {};
        const remoteAudioAnalysers = {};
        const peerHealth = {};
        const peerJoinTimestamps = {};
        const reconnectLocks = {};
        let chatOpen = false;

        let savedProfileRaw = {};
        try {
            savedProfileRaw = JSON.parse(localStorage.getItem('voiceup_profile')) || {};
        } catch (e) {
            savedProfileRaw = {};
        }

        // Никогда не загружаем устаревший флаг isAdmin из localStorage профиля!
        let myProfile = {
            nick: savedProfileRaw.nick || "",
            color: savedProfileRaw.color || "#ffffff",
            avatar: savedProfileRaw.avatar || "",
            isAdmin: false
        };

        function saveMyProfileToStorage() {
            localStorage.setItem('voiceup_profile', JSON.stringify({
                nick: myProfile.nick,
                color: myProfile.color,
                avatar: myProfile.avatar,
                deviceId: myProfile.deviceId
            }));
        }

        function getDeviceId() {
            let fp = localStorage.getItem('voiceup_hwid');
            if (!fp) {
                const guid = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                fp = 'hw_' + guid; 
                localStorage.setItem('voiceup_hwid', fp);
            }
            return fp;
        }
        myProfile.deviceId = getDeviceId();
        myProfile.deviceType = myDeviceType;

        let bannedDevices = JSON.parse(localStorage.getItem('voiceup_banned_devices')) || {};
        let ignoredAppeals = JSON.parse(localStorage.getItem('voiceup_ignored_appeals')) || {};
        let micHotkey = localStorage.getItem('voiceup_hotkey') || null; 
        let deafenHotkey = localStorage.getItem('voiceup_deafen_hotkey') || null;
        
        const userProfiles = {}; 
        const userStates = {}; 
        const localPeerSettings = {}; 
        let micEnabled = true; 
        let adminMuted = false; 
        let soundEnabled = true;
        let isAssigningMicHotkey = false; 
        let isAssigningDeafenHotkey = false;

        // ДЕТЕРМИНИРОВАННЫЙ ВЫБОР ЕДИНСТВЕННОГО СОЗДАТЕЛЯ (HOST ELECTION / RECONCILIATION)
        // Гарантирует, что в комнате СТРОГО ОДИН "создатель" (участник с самым ранним временем входа joinedAt, при равенстве — наименьший ID слота)
        function electAndSyncSingleHost() {
            if (!myId) return;

            peerJoinTimestamps[myId] = myJoinedAt;

            const candidates = [myId];
            Object.keys(userProfiles).forEach(pid => {
                if (pid && pid !== myId) {
                    const lastSeen = peerHealth[pid]?.lastSeen || 0;
                    if (Date.now() - lastSeen <= PEER_DEAD_TIMEOUT_MS) {
                        candidates.push(pid);
                    }
                }
            });

            // Если текущий хост жив и отвечает на пинги быстрее 4.5 сек — проверяем, кто вошел раньше всех
            candidates.sort((a, b) => {
                const tsA = peerJoinTimestamps[a] || Number.MAX_SAFE_INTEGER;
                const tsB = peerJoinTimestamps[b] || Number.MAX_SAFE_INTEGER;
                if (Math.abs(tsA - tsB) > 400) {
                    return tsA - tsB;
                }
                return a.localeCompare(b);
            });

            const winnerId = candidates[0] || myId;
            const changed = (currentHostId !== winnerId);
            currentHostId = winnerId;
            isRoomHost = (currentHostId === myId);
            myProfile.isAdmin = isRoomHost;

            // Обновляем флаг isAdmin у всех карточек: строго один админ (winnerId)
            Object.keys(userProfiles).forEach(pid => {
                if (userProfiles[pid]) {
                    userProfiles[pid].isAdmin = (pid === currentHostId);
                }
            });

            updateRoomHeaderUI();

            if (document.getElementById(`card-${myId}`)) {
                updateCardVisuals(myId, myProfile, true);
            }
            Object.keys(userProfiles).forEach(pid => {
                if (pid !== myId && document.getElementById(`card-${pid}`)) {
                    updateCardVisuals(pid, userProfiles[pid], false);
                }
            });

            if (changed && isRoomHost) {
                broadcastSignaling({
                    type: 'host-sync',
                    id: myId,
                    hostId: currentHostId,
                    joinedAt: myJoinedAt
                });
            }
        }

        function shouldInitiateCall(peerA, peerB) {
            return peerA > peerB;
        }

        function getKnownPeerList() {
            const set = new Set([
                myId,
                ...Object.keys(activeConnections).filter(id => activeConnections[id]?.open),
                ...Object.keys(userProfiles)
            ]);
            return Array.from(set).filter(Boolean);
        }

        function broadcastSignaling(msgObj) {
            for (const pid in activeConnections) {
                if (activeConnections[pid] && activeConnections[pid].open) {
                    try { activeConnections[pid].send(msgObj); } catch(e) {}
                }
            }
        }

        function sendToPeer(targetId, msgObj) {
            if (activeConnections[targetId] && activeConnections[targetId].open) {
                try { activeConnections[targetId].send(msgObj); } catch(e) {}
            }
        }

        function showToast(msg) {
            toastNotif.innerText = msg;
            toastNotif.classList.add('show');
            setTimeout(() => { toastNotif.classList.remove('show'); }, 1800);
        }

        // 4. ЗАЩИТА ОТ ОБРЫВОВ WEBRTC (HEARTBEAT КАЖДЫЕ 3 СЕК + HOST MIGRATION ЗА 4 СЕК)
        function startHeartbeatLoop() {
            if (heartbeatTimer) clearInterval(heartbeatTimer);

            heartbeatTimer = setInterval(() => {
                if (!peer) return;

                // Если соединение с брокером PeerJS разорвалось — автоматически переподключаемся
                if (peer.disconnected && !peer.destroyed) {
                    updateNetQualityDOM(myId, 'bad', 999);
                    try { peer.reconnect(); } catch (e) {}
                } else if (!peer.destroyed) {
                    updateNetQualityDOM(myId, 'good', 0);
                }

                const now = Date.now();
                const allPeerIds = new Set([
                    ...Object.keys(activeConnections),
                    ...Object.keys(userProfiles).filter(id => id !== myId)
                ]);

                allPeerIds.forEach(pid => {
                    if (!pid || pid === myId) return;

                    if (!peerHealth[pid]) {
                        peerHealth[pid] = { lastSeen: now, rtt: 40, quality: 'good', reconnecting: false };
                    }

                    const conn = activeConnections[pid];
                    if (conn && conn.open) {
                        try {
                            conn.send({
                                type: 'ping',
                                id: myId,
                                ts: now,
                                joinedAt: myJoinedAt,
                                hostId: currentHostId,
                                peers: getKnownPeerList()
                            });
                        } catch (e) {}
                    }

                    // Замер RTT через WebRTC getStats, если есть активный звонок
                    const call = activeCalls[pid];
                    if (call && call.peerConnection) {
                        try {
                            call.peerConnection.getStats().then(stats => {
                                stats.forEach(report => {
                                    if (report.type === 'candidate-pair' && report.state === 'succeeded' && typeof report.currentRoundTripTime === 'number') {
                                        const statsRtt = Math.round(report.currentRoundTripTime * 1000);
                                        if (statsRtt > 0) {
                                            applyRttMeasurement(pid, statsRtt);
                                        }
                                    }
                                });
                            }).catch(() => {});
                        } catch (e) {}
                    }

                    const elapsed = now - peerHealth[pid].lastSeen;

                    // Если текущий Хост не отвечает дольше 4.5 секунд — запускаем процедуру выборов нового хоста (Host Migration)
                    if (pid === currentHostId && elapsed > HOST_ELECTION_TIMEOUT_MS) {
                        delete peerJoinTimestamps[pid];
                        electAndSyncSingleHost();
                    }

                    if (elapsed > PEER_DEAD_TIMEOUT_MS) {
                        cleanupPeer(pid);
                    } else if (elapsed > PEER_STALE_TIMEOUT_MS) {
                        updateNetQualityDOM(pid, 'bad', Math.min(999, Math.round(elapsed / 10)));
                        triggerSoftPeerReconnect(pid);
                    }
                });

                electAndSyncSingleHost();
            }, HEARTBEAT_INTERVAL_MS);
        }

        // ПЕРИОДИЧЕСКИЙ RENDEZVOUS-ОПРОС СЛОТОВ КОМНАТЫ (ДЛЯ АВТО-СШИВКИ MESH СЕТИ)
        function scanRoomSlotsForPeers() {
            if (!peer || peer.destroyed || !myId) return;
            const slots = getAllSlotPeerIds();
            const cached = getCachedRoomPeers();
            const targets = Array.from(new Set([...slots, ...cached]));

            targets.forEach(targetId => {
                if (!targetId || targetId === myId) return;
                connectDataToPeer(targetId);
            });
        }

        function startMeshDiscoveryLoop() {
            if (meshScanTimer) clearInterval(meshScanTimer);
            // Сразу сканируем все слоты комнаты при входе, затем повторяем через 2.5с и каждые 6с
            scanRoomSlotsForPeers();
            setTimeout(scanRoomSlotsForPeers, 2500);
            meshScanTimer = setInterval(() => {
                if (!peer || peer.destroyed) return;
                // Опрашиваем слоты, с которыми еще нет открытого соединения
                const slots = getAllSlotPeerIds();
                slots.forEach(slotId => {
                    if (slotId !== myId && (!activeConnections[slotId] || !activeConnections[slotId].open)) {
                        connectDataToPeer(slotId);
                    }
                });
            }, 6000);
        }

        function applyRttMeasurement(peerId, rttMs) {
            if (!peerHealth[peerId]) {
                peerHealth[peerId] = { lastSeen: Date.now(), rtt: rttMs, quality: 'good', reconnecting: false };
            }
            peerHealth[peerId].rtt = rttMs;
            let q = 'good';
            if (rttMs > 260) q = 'bad';
            else if (rttMs > 120) q = 'medium';
            updateNetQualityDOM(peerId, q, rttMs);
        }

        // ПЛАВНОЕ АВТО-ПЕРЕПОДКЛЮЧЕНИЕ WEBRTC БЕЗ СБРОСА ИНТЕРФЕЙСА
        function triggerSoftPeerReconnect(remoteId) {
            if (!peer || peer.destroyed || !remoteId || remoteId === myId) return;
            if (reconnectLocks[remoteId]) return;

            reconnectLocks[remoteId] = true;
            updateNetQualityDOM(remoteId, 'bad', peerHealth[remoteId]?.rtt || 450);

            // 1. Проверяем DataConnection
            const existingConn = activeConnections[remoteId];
            if (!existingConn || !existingConn.open) {
                try { if (existingConn) existingConn.close(); } catch (e) {}
                delete activeConnections[remoteId];
                delete connectionAttemptTs[remoteId];
                connectDataToPeer(remoteId);
            } else {
                try {
                    existingConn.send({
                        type: 'request_voice_reconnect',
                        id: myId,
                        joinedAt: myJoinedAt,
                        profile: myProfile,
                        state: userStates[myId]
                    });
                } catch (e) {}
            }

            // 2. Проверяем MediaConnection (голос) и делаем ICE restart / перевызов
            const existingCall = activeCalls[remoteId];
            const iceState = existingCall?.peerConnection?.iceConnectionState;
            const connState = existingCall?.peerConnection?.connectionState;
            const isCallBroken = !existingCall ||
                iceState === 'disconnected' ||
                iceState === 'failed' ||
                iceState === 'closed' ||
                connState === 'disconnected' ||
                connState === 'failed' ||
                connState === 'closed';

            if (isCallBroken) {
                if (existingCall) {
                    try {
                        if (existingCall.peerConnection && typeof existingCall.peerConnection.restartIce === 'function') {
                            existingCall.peerConnection.restartIce();
                        }
                    } catch (e) {}
                    try { existingCall.close(); } catch (e) {}
                    delete activeCalls[remoteId];
                }
                setTimeout(() => {
                    if (localStream && peer && !peer.destroyed) {
                        callVoicePeer(remoteId, true);
                    }
                }, 350);
            }

            setTimeout(() => {
                delete reconnectLocks[remoteId];
            }, 4500);
        }

        // ОБРАБОТЧИК СИГНАЛОВ MESH-СЕТИ
        function handleIncomingSignal(remoteId, message) {
            if (!message || typeof message !== 'object') return;
            const peerId = message.id || remoteId;
            if (!peerId || peerId === myId) return;

            // Обновляем таймер активности пира
            if (!peerHealth[peerId]) {
                peerHealth[peerId] = { lastSeen: Date.now(), rtt: 35, quality: 'good', reconnecting: false };
            } else {
                peerHealth[peerId].lastSeen = Date.now();
            }

            if (typeof message.joinedAt === 'number' && message.joinedAt > 0) {
                peerJoinTimestamps[peerId] = message.joinedAt;
            }

            // Heartbeat Ping / Pong
            if (message.type === 'ping') {
                sendToPeer(peerId, {
                    type: 'pong',
                    id: myId,
                    ts: message.ts,
                    joinedAt: myJoinedAt,
                    hostId: currentHostId,
                    peers: getKnownPeerList()
                });
                if (Array.isArray(message.peers)) {
                    message.peers.forEach(otherId => {
                        if (otherId && otherId !== myId && (!activeConnections[otherId] || !activeConnections[otherId].open)) {
                            connectDataToPeer(otherId);
                        }
                    });
                }
                if (!activeCalls[peerId]) {
                    evaluateVoiceCall(peerId);
                }
                electAndSyncSingleHost();
                return;
            }

            if (message.type === 'pong') {
                const rtt = Math.max(1, Date.now() - (message.ts || Date.now()));
                applyRttMeasurement(peerId, rtt);
                if (Array.isArray(message.peers)) {
                    message.peers.forEach(otherId => {
                        if (otherId && otherId !== myId && (!activeConnections[otherId] || !activeConnections[otherId].open)) {
                            connectDataToPeer(otherId);
                        }
                    });
                }
                electAndSyncSingleHost();
                return;
            }

            if (message.type === 'host-sync') {
                electAndSyncSingleHost();
                return;
            }

            if (message.type === 'request_voice_reconnect') {
                if (activeCalls[peerId]) {
                    try { activeCalls[peerId].close(); } catch (e) {}
                    delete activeCalls[peerId];
                }
                callVoicePeer(peerId, true);
                return;
            }

            const peerProfile = message.profile || userProfiles[peerId] || { nick: dict[currentLang].guest, color: '#ffffff', avatar: '', deviceType: 'pc' };

            // Проверка бана (выполняет текущий создатель комнаты)
            if (isRoomHost && (message.type === 'join' || message.type === 'handshake')) {
                if (bannedDevices[message.profile?.deviceId]) {
                    sendToPeer(peerId, { type: 'banned_reject', target: peerId, senderName: myProfile.nick });
                    return;
                }
            }

            // Апелляция бана
            if (isRoomHost && message.type === 'ban_appeal') {
                if (ignoredAppeals[message.deviceId]) return; 
                const notifId = `appeal-${message.deviceId}`; 
                if (document.getElementById(notifId)) return; 
                const notif = document.createElement('div'); 
                notif.id = notifId; 
                notif.className = 'appeal-card';
                notif.innerHTML = `<div style="font-size:13px; margin-bottom:10px;"><b>${escapeHTML(message.nick)}</b> ${dict[currentLang].wantsToJoin}.</div><div style="display:flex; gap:6px;"><button class="primary-btn" style="padding:6px; font-size:11px;" onclick="acceptAppeal('${message.id}', '${message.deviceId}')">${dict[currentLang].letIn}</button><button class="secondary-btn" style="padding:6px; font-size:11px; border-color:var(--danger); color:var(--danger);" onclick="ignoreAppeal('${message.deviceId}')">${dict[currentLang].hide}</button></div>`;
                document.getElementById('admin-notifications').appendChild(notif); 
                return;
            }

            if (message.type === 'banned_reject' && message.target === myId) {
                localStorage.setItem('voiceup_banned', 'true');
                showBannedScreen();
                return;
            }

            if (message.type === 'admin_kick') {
                if (message.target === myId) {
                    localStorage.setItem('voiceup_banned', 'true');
                    broadcastSignaling({ type: 'leave', id: myId });
                    showBannedScreen();
                } else {
                    cleanupPeer(message.target);
                    playUiSound('leave');
                }
                return;
            }

            if (message.type === 'appeal_accepted' && message.target === myId) {
                localStorage.removeItem('voiceup_banned');
                window.location.reload();
                return;
            }

            if (message.type === 'leave' || message.type === 'peer_left') {
                const targetToClean = message.id || peerId;
                cleanupPeer(targetToClean);
                playUiSound('leave');
                electAndSyncSingleHost();
                return;
            }

            if (message.type === 'admin_mute' && message.target === myId) { 
                adminMuted = true; 
                updateMicHardware(); 
                return; 
            }
            if (message.type === 'admin_unmute' && message.target === myId) { 
                adminMuted = false; 
                updateMicHardware(); 
                return; 
            }

            if (message.type === 'status') { 
                userStates[peerId] = message.state; 
                updateCardVisuals(peerId, userProfiles[peerId] || peerProfile, false); 
                return; 
            }

            if (message.type === 'update-profile') { 
                userProfiles[peerId] = peerProfile; 
                electAndSyncSingleHost();
                updateCardVisuals(peerId, userProfiles[peerId], false); 
                return; 
            }

            // ПОЛНАЯ СИНХРОНИЗАЦИЯ УЧАСТНИКОВ (Join / Room-State / Handshake / New-Peer)
            if (message.type === 'join' || message.type === 'handshake') {
                userProfiles[peerId] = peerProfile;
                userStates[peerId] = message.state || { mic: true, deaf: false, adminMuted: false };
                addUserCard(peerId, peerProfile, false);
                electAndSyncSingleHost();
                updateCachedRoomPeers();

                // Отправляем полное состояние комнаты и список всех известных участников
                sendToPeer(peerId, {
                    type: 'room-state',
                    target: peerId,
                    id: myId,
                    joinedAt: myJoinedAt,
                    hostId: currentHostId,
                    profile: myProfile,
                    state: userStates[myId],
                    peerList: getKnownPeerList()
                });

                if (message.type === 'join') {
                    broadcastSignaling({
                        type: 'new-peer-announced',
                        id: peerId,
                        joinedAt: peerJoinTimestamps[peerId],
                        profile: peerProfile,
                        state: userStates[peerId]
                    });
                }

                if (Array.isArray(message.peerList)) {
                    message.peerList.forEach(otherId => {
                        if (otherId && otherId !== myId && (!activeConnections[otherId] || !activeConnections[otherId].open)) {
                            connectDataToPeer(otherId);
                        }
                    });
                }

                evaluateVoiceCall(peerId);
                return;
            }

            if (message.type === 'room-state') {
                userProfiles[peerId] = peerProfile;
                userStates[peerId] = message.state || { mic: true, deaf: false, adminMuted: false };
                addUserCard(peerId, peerProfile, false);
                electAndSyncSingleHost();
                updateCachedRoomPeers();
                evaluateVoiceCall(peerId);

                if (Array.isArray(message.peerList)) {
                    message.peerList.forEach(otherId => {
                        if (otherId && otherId !== myId && (!activeConnections[otherId] || !activeConnections[otherId].open)) {
                            connectDataToPeer(otherId);
                        }
                    });
                }
                return;
            }

            if (message.type === 'new-peer-announced' && message.id !== myId) {
                const newPeerId = message.id;
                if (typeof message.joinedAt === 'number') {
                    peerJoinTimestamps[newPeerId] = message.joinedAt;
                }
                userProfiles[newPeerId] = message.profile || peerProfile;
                userStates[newPeerId] = message.state || { mic: true, deaf: false, adminMuted: false };
                addUserCard(newPeerId, userProfiles[newPeerId], false);
                electAndSyncSingleHost();
                updateCachedRoomPeers();

                if (!activeConnections[newPeerId] || !activeConnections[newPeerId].open) {
                    connectDataToPeer(newPeerId);
                } else {
                    evaluateVoiceCall(newPeerId);
                }
                return;
            }

            if (message.type === 'chat') {
                handleIncomingMessage(peerId, message.data);
            }
        }

        // ДЕТЕРМИНИРОВАННЫЙ ГОЛОСОВОЙ ЗВОНОК + РЕЗЕРВНЫЙ ВЫЗОВ ЧЕРЕЗ 2.2 СЕК
        function evaluateVoiceCall(remoteId) {
            if (!peer || !localStream || activeCalls[remoteId] || remoteId === myId) return;
            if (shouldInitiateCall(myId, remoteId)) {
                callVoicePeer(remoteId, false);
            } else {
                // Если второй пир не позвонил за 2.2 секунды — инициируем вызов сами
                setTimeout(() => {
                    if (peer && !peer.destroyed && localStream && !activeCalls[remoteId] && activeConnections[remoteId]?.open) {
                        callVoicePeer(remoteId, false);
                    }
                }, 2200);
            }
        }

        function attachPeerConnectionMonitors(pc, remoteId) {
            if (!pc) return;
            const handleStateChange = () => {
                const ice = pc.iceConnectionState;
                const conn = pc.connectionState;
                if (ice === 'connected' || ice === 'completed' || conn === 'connected') {
                    if (peerHealth[remoteId]) peerHealth[remoteId].lastSeen = Date.now();
                    updateNetQualityDOM(remoteId, 'good', peerHealth[remoteId]?.rtt || 32);
                } else if (ice === 'disconnected' || conn === 'disconnected') {
                    updateNetQualityDOM(remoteId, 'bad', 400);
                    setTimeout(() => {
                        if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                            triggerSoftPeerReconnect(remoteId);
                        }
                    }, 2000);
                } else if (ice === 'failed' || conn === 'failed') {
                    updateNetQualityDOM(remoteId, 'bad', 999);
                    triggerSoftPeerReconnect(remoteId);
                }
            };
            pc.oniceconnectionstatechange = handleStateChange;
            pc.onconnectionstatechange = handleStateChange;
        }

        function callVoicePeer(remoteId, forceCall) {
            if (!peer || !localStream || remoteId === myId) return;
            if (activeCalls[remoteId] && !forceCall) return;
            try {
                const call = peer.call(remoteId, localStream);
                if (call) {
                    activeCalls[remoteId] = call;
                    if (call.peerConnection) {
                        attachPeerConnectionMonitors(call.peerConnection, remoteId);
                    }
                    call.on('stream', (stream) => {
                        attachRemoteAudio(remoteId, stream);
                        if (peerHealth[remoteId]) peerHealth[remoteId].lastSeen = Date.now();
                        updateNetQualityDOM(remoteId, 'good', peerHealth[remoteId]?.rtt || 30);
                    });
                    call.on('close', () => {
                        if (activeCalls[remoteId] === call) {
                            delete activeCalls[remoteId];
                        }
                    });
                    call.on('error', () => {
                        if (activeCalls[remoteId] === call) {
                            delete activeCalls[remoteId];
                        }
                        setTimeout(() => triggerSoftPeerReconnect(remoteId), 2000);
                    });
                }
            } catch(e) {
                console.error('Failed to initiate voice call:', e);
            }
        }

        function bindPeerEvents() {
            peer.on('connection', (conn) => {
                setupDataConnection(conn);
            });

            peer.on('call', (call) => {
                activeCalls[call.peer] = call;
                call.answer(localStream);
                if (call.peerConnection) {
                    attachPeerConnectionMonitors(call.peerConnection, call.peer);
                }
                call.on('stream', (remoteStream) => {
                    attachRemoteAudio(call.peer, remoteStream);
                    if (peerHealth[call.peer]) peerHealth[call.peer].lastSeen = Date.now();
                    updateNetQualityDOM(call.peer, 'good', peerHealth[call.peer]?.rtt || 30);
                });
                call.on('close', () => {
                    if (activeCalls[call.peer] === call) {
                        delete activeCalls[call.peer];
                    }
                });
                call.on('error', () => {
                    if (activeCalls[call.peer] === call) {
                        delete activeCalls[call.peer];
                    }
                });
            });

            peer.on('disconnected', () => {
                updateNetQualityDOM(myId, 'bad', 999);
                setTimeout(() => {
                    if (peer && peer.disconnected && !peer.destroyed) {
                        try { peer.reconnect(); } catch (e) {}
                    }
                }, 800);
            });

            peer.on('error', (err) => {
                // Игнорируем штатную ошибку peer-unavailable при опросе пустых слотов комнаты
                if (err && err.type === 'peer-unavailable') return;
                console.warn('Peer notice:', err.type);
            });
        }

        // ЗАЩИЩЕННОЕ ОТ ДУБЛИКАТОВ ПОДКЛЮЧЕНИЕ DATACHANNEL
        function connectDataToPeer(remoteId) {
            if (!peer || peer.destroyed || !remoteId || remoteId === myId) return;
            const existing = activeConnections[remoteId];
            if (existing && existing.open) return;

            // Не перебиваем соединение, которое прямо сейчас проходит ICE-рукопожатие (до 6.5 сек)
            const lastAttempt = connectionAttemptTs[remoteId] || 0;
            if (existing && (Date.now() - lastAttempt < 6500)) return;

            try {
                connectionAttemptTs[remoteId] = Date.now();
                const conn = peer.connect(remoteId, { reliable: true });
                setupDataConnection(conn);
            } catch (e) {}
        }

        function setupDataConnection(conn) {
            if (!conn || !conn.peer) return;
            const remoteId = conn.peer;

            // Сохраняем ссылку, только если еще нет уже открытого канала
            if (!activeConnections[remoteId] || !activeConnections[remoteId].open) {
                activeConnections[remoteId] = conn;
            }

            if (!peerHealth[remoteId]) {
                peerHealth[remoteId] = { lastSeen: Date.now(), rtt: 35, quality: 'good', reconnecting: false };
            }

            conn.on('open', () => {
                activeConnections[remoteId] = conn;
                connectionAttemptTs[remoteId] = Date.now();
                peerHealth[remoteId].lastSeen = Date.now();
                updateCachedRoomPeers();

                if (conn.peerConnection) {
                    attachPeerConnectionMonitors(conn.peerConnection, remoteId);
                }

                // Отправляем сигнал join при открытии канала с любым пиром
                try {
                    conn.send({
                        type: 'join',
                        id: myId,
                        slotIndex: mySlotIndex,
                        joinedAt: myJoinedAt,
                        hostId: currentHostId,
                        profile: myProfile,
                        state: userStates[myId],
                        peerList: getKnownPeerList()
                    });
                } catch (e) {}

                evaluateVoiceCall(remoteId);
            });

            conn.on('data', (data) => {
                handleIncomingSignal(conn.peer, data);
            });

            conn.on('close', () => {
                if (activeConnections[remoteId] === conn) {
                    delete activeConnections[remoteId];
                    delete connectionAttemptTs[remoteId];
                    updateNetQualityDOM(remoteId, 'bad', 999);
                    setTimeout(() => {
                        if (userProfiles[remoteId] && (!activeConnections[remoteId] || !activeConnections[remoteId].open)) {
                            triggerSoftPeerReconnect(remoteId);
                        }
                    }, 1500);
                }
            });

            conn.on('error', () => {
                if (activeConnections[remoteId] === conn) {
                    delete activeConnections[remoteId];
                    delete connectionAttemptTs[remoteId];
                }
            });
        }

        function attachRemoteAudio(peerId, remoteStream) {
            let audio = document.getElementById(`audio-${peerId}`);
            if (!audio) {
                audio = document.createElement('audio');
                audio.id = `audio-${peerId}`;
                audio.autoplay = true;
                audio.playsInline = true;
                audio.style.display = 'none';
                document.getElementById('webrtc-audio-container').appendChild(audio);
            }
            audio.srcObject = remoteStream;
            const vol = localPeerSettings[peerId] ? localPeerSettings[peerId].volume : 1;
            const isMuted = localPeerSettings[peerId] ? localPeerSettings[peerId].muted : false;
            audio.volume = isMuted ? 0 : vol;
            audio.muted = !soundEnabled;
            audio.play().catch(() => {});

            setupSpeakingDetector(peerId, remoteStream);
        }

        function setupSpeakingDetector(peerId, stream) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                if (remoteAudioAnalysers[peerId]) {
                    try { remoteAudioAnalysers[peerId].disconnect(); } catch (e) {}
                }
                const src = audioCtx.createMediaStreamSource(stream);
                const analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.3;
                src.connect(analyser);
                remoteAudioAnalysers[peerId] = src;
                const data = new Uint8Array(analyser.frequencyBinCount);

                const checkVoice = () => {
                    const card = document.getElementById(`card-${peerId}`);
                    if (!card || remoteAudioAnalysers[peerId] !== src) return;
                    analyser.getByteFrequencyData(data);
                    let sum = 0;
                    for (let i = 0; i < data.length; i++) sum += data[i];
                    let avg = sum / data.length;
                    const avatar = card.querySelector('.avatar');
                    if (avatar) {
                        if (avg > 15) avatar.classList.add('speaking');
                        else avatar.classList.remove('speaking');
                    }
                    requestAnimationFrame(checkVoice);
                };
                requestAnimationFrame(checkVoice);
            } catch(e) {}
        }

        // ЛОКАЛЬНЫЙ ДЕТЕКТОР РЕЧИ (ПОДСВЕТКА СВОЕЙ АВАТАРКИ)
        function startLocalSpeakingDetector() {
            if (!localStream) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const micSource = audioCtx.createMediaStreamSource(localStream);
                const localAnalyser = audioCtx.createAnalyser();
                localAnalyser.fftSize = 256;
                localAnalyser.smoothingTimeConstant = 0.3;
                micSource.connect(localAnalyser);

                const dataArray = new Uint8Array(localAnalyser.frequencyBinCount);
                let localSpeaking = false;
                let localSpeakTimeout = null;

                const checkLocalVoice = () => {
                    const myCard = document.getElementById(`card-${myId}`);
                    const actualMic = micEnabled && !adminMuted;
                    
                    if (!actualMic) {
                        if (localSpeaking && myCard) {
                            localSpeaking = false;
                            myCard.querySelector('.avatar')?.classList.remove('speaking');
                        }
                        requestAnimationFrame(checkLocalVoice);
                        return;
                    }

                    localAnalyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    let avg = sum / dataArray.length;

                    if (avg > 15) {
                        if (!localSpeaking) {
                            localSpeaking = true;
                            if (myCard) myCard.querySelector('.avatar')?.classList.add('speaking');
                        }
                        clearTimeout(localSpeakTimeout);
                        localSpeakTimeout = setTimeout(() => {
                            localSpeaking = false;
                            const card = document.getElementById(`card-${myId}`);
                            if (card) card.querySelector('.avatar')?.classList.remove('speaking');
                        }, 300);
                    }
                    requestAnimationFrame(checkLocalVoice);
                };
                requestAnimationFrame(checkLocalVoice);
            } catch(e) {
                console.error("Local speech detector init error:", e);
            }
        }

        // 1. ЖЕЛЕЗОБЕТОННАЯ MESH-СИНХРОНИЗАЦИЯ КОМНАТЫ ЧЕРЕЗ ПРЕДСКАЗУЕМЫЕ СЛОТЫ (${activeRoom}_0 ... ${activeRoom}_5)
        function startPeerConnection() {
            if (peer) {
                try { peer.destroy(); } catch (e) {}
                peer = null;
            }

            // Попытка последовательно занять свободный слот 0..5 в пуле комнаты
            const tryAcquireSlot = (slotIdx) => {
                const candidateId = slotIdx < MAX_ROOM_SLOTS
                    ? getSlotPeerId(slotIdx)
                    : `${activeRoom}_${Math.random().toString(36).substring(2, 7)}`;

                const candidatePeer = new Peer(candidateId, PEER_CONFIG);
                let settled = false;

                const slotTimeout = setTimeout(() => {
                    if (!settled) {
                        settled = true;
                        try { candidatePeer.destroy(); } catch (e) {}
                        tryAcquireSlot(slotIdx + 1);
                    }
                }, 3500);

                candidatePeer.on('open', (assignedId) => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(slotTimeout);

                    peer = candidatePeer;
                    myId = assignedId;
                    mySlotIndex = slotIdx;
                    // Если мы заняли слот > 0, в комнате гарантированно уже есть создатель (слот 0),
                    // поэтому наш joinedAt заведомо позже, а начальный статус — "гость"!
                    myJoinedAt = Date.now() + (slotIdx > 0 ? slotIdx * 10 : 0);
                    peerJoinTimestamps[myId] = myJoinedAt;

                    if (slotIdx === 0) {
                        currentHostId = myId;
                        isRoomHost = true;
                        myProfile.isAdmin = true;
                    } else {
                        currentHostId = getSlotPeerId(0);
                        isRoomHost = false;
                        myProfile.isAdmin = false;
                    }

                    peerHealth[myId] = { lastSeen: Date.now(), rtt: 0, quality: 'good', reconnecting: false };
                    userStates[myId] = { mic: micEnabled && !adminMuted, deaf: !soundEnabled, adminMuted: adminMuted };

                    updateRoomHeaderUI();
                    addUserCard(myId, myProfile, true);
                    bindPeerEvents();
                    startLocalSpeakingDetector();
                    startSessionTimer();
                    startHeartbeatLoop();
                    startMeshDiscoveryLoop();
                });

                candidatePeer.on('error', (err) => {
                    if (settled) return;
                    settled = true;
                    clearTimeout(slotTimeout);
                    try { candidatePeer.destroy(); } catch (e) {}
                    // Если слот занят (unavailable-id) — мгновенно переходим к следующему слоту
                    tryAcquireSlot(slotIdx + 1);
                });
            };

            tryAcquireSlot(0);
        }

        function playUiSound(action) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                function playTone(type, freq, tStart, tDuration, sweepFreq = null) {
                    const osc = audioCtx.createOscillator(); 
                    const gainNode = audioCtx.createGain();
                    osc.connect(gainNode); 
                    gainNode.connect(audioCtx.destination);
                    osc.type = type; 
                    osc.frequency.setValueAtTime(freq, tStart);
                    if (sweepFreq) osc.frequency.exponentialRampToValueAtTime(sweepFreq, tStart + tDuration);
                    gainNode.gain.setValueAtTime(0, tStart); 
                    gainNode.gain.linearRampToValueAtTime(0.04, tStart + 0.02);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, tStart + tDuration - 0.01); 
                    gainNode.gain.setValueAtTime(0, tStart + tDuration);
                    osc.start(tStart); 
                    osc.stop(tStart + tDuration);
                }
                if (action === 'mic_on') playTone('sine', 400, now, 0.15, 800); 
                else if (action === 'mic_off') playTone('sine', 800, now, 0.15, 400); 
                else if (action === 'deafen_off') playTone('triangle', 150, now, 0.15, 300); 
                else if (action === 'deafen_on') playTone('triangle', 300, now, 0.15, 150); 
                else if (action === 'join') { playTone('sine', 523.25, now, 0.15); playTone('sine', 659.25, now + 0.15, 0.3); } 
                else if (action === 'leave') { playTone('triangle', 349.23, now, 0.12); playTone('triangle', 261.63, now + 0.14, 0.2); } 
                else if (action === 'chat_msg') { playTone('sine', 600, now, 0.05, 800); playTone('sine', 600, now + 0.06, 0.05, 800); }
            } catch(e) {}
        }
