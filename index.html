        let sessionStartTime = 0;
        let sessionTimerInterval = null;

        function formatSessionDuration(totalSeconds) {
            const hrs = Math.floor(totalSeconds / 3600);
            const mins = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            const pad = (n) => String(n).padStart(2, '0');
            if (hrs > 0) {
                return `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
            }
            return `${pad(mins)}:${pad(secs)}`;
        }

        function startSessionTimer() {
            stopSessionTimer();
            sessionStartTime = Date.now();
            roomSessionTimer.innerText = '00:00';
            sessionTimerInterval = setInterval(() => {
                const elapsedSec = Math.max(0, Math.floor((Date.now() - sessionStartTime) / 1000));
                roomSessionTimer.innerText = formatSessionDuration(elapsedSec);
            }, 1000);
        }

        function stopSessionTimer() {
            if (sessionTimerInterval) {
                clearInterval(sessionTimerInterval);
                sessionTimerInterval = null;
            }
            roomSessionTimer.innerText = '00:00';
        }

        function getPinnedRooms() {
            try {
                return JSON.parse(localStorage.getItem('voiceup_pinned_rooms')) || [];
            } catch (e) {
                return [];
            }
        }

        function savePinnedRooms(list) {
            localStorage.setItem('voiceup_pinned_rooms', JSON.stringify(list.slice(0, MAX_PINNED_ROOMS)));
            renderPinnedRoomsUI();
            updateRoomHeaderUI();
        }

        function renderPinnedRoomsUI() {
            const list = getPinnedRooms();
            pinnedCounterText.innerText = `${dict[currentLang].pinnedTitle} (${list.length}/${MAX_PINNED_ROOMS})`;
            pinnedRoomsList.innerHTML = '';
            
            if (list.length > 0) {
                pinnedSection.style.display = 'flex';
                list.forEach(r => {
                    const item = document.createElement('div');
                    item.className = 'pinned-room-btn';
                    item.innerHTML = `
                        <span class="pinned-room-name">${dict[currentLang].enterPinnedPrefix}${escapeHTML(r)}</span>
                        <span class="pinned-room-del" title="удалить">×</span>
                    `;
                    item.querySelector('.pinned-room-name').onclick = () => {
                        roomCodeInput.value = r;
                        activeRoom = r;
                        document.getElementById('startBtn').click();
                    };
                    item.querySelector('.pinned-room-del').onclick = (e) => {
                        e.stopPropagation();
                        const updated = getPinnedRooms().filter(itemRoom => itemRoom !== r);
                        savePinnedRooms(updated);
                        showToast(dict[currentLang].roomUnpinned);
                    };
                    pinnedRoomsList.appendChild(item);
                });
            } else {
                pinnedSection.style.display = 'none';
            }
        }

        // СОСТОЯНИЕ НЕУБИВАЕМОЙ СИНХРОНИЗАЦИИ И WEBRTC СВЯЗИ
        let myId = "";
        let myJoinTimestamp = 0;
        let roomCreatorDeviceId = "";
        let currentAdminPeerId = "";
        let qrCodeInstance = null;
        let presenceTimer = null;
        let mqttClients = [];
        let ntfySocket = null;
        let localBroadcastChannel = null;
        let isInRoom = false;
        let isMyPeerOpen = false;

        // ХРАНЕНИЕ БАНОВ СТРОГО ДЛЯ ТЕКУЩЕЙ КОМНАТЫ (activeRoom)
        function loadRoomBannedDevices(roomName) {
            try {
                const raw = JSON.parse(localStorage.getItem('voiceup_banned_devices_' + roomName)) || {};
                const normalized = {};
                Object.keys(raw).forEach(devId => {
                    if (raw[devId] && typeof raw[devId] === 'object') {
                        normalized[devId] = {
                            nick: raw[devId].nick || dict[currentLang].guest,
                            deviceId: devId,
                            timestamp: raw[devId].timestamp || Date.now()
                        };
                    } else if (raw[devId]) {
                        normalized[devId] = {
                            nick: devId,
                            deviceId: devId,
                            timestamp: Date.now()
                        };
                    }
                });
                return normalized;
            } catch (e) {
                return {};
            }
        }

        function saveRoomBannedDevices(roomName, mapObj) {
            try {
                localStorage.setItem('voiceup_banned_devices_' + roomName, JSON.stringify(mapObj || {}));
            } catch (e) {}
            updateBanlistUI();
        }

        function isClientBannedInRoom(roomName) {
            return localStorage.getItem('voiceup_banned_' + roomName) === 'true';
        }

        function setClientBannedInRoom(roomName, isBanned) {
            if (isBanned) {
                localStorage.setItem('voiceup_banned_' + roomName, 'true');
            } else {
                localStorage.removeItem('voiceup_banned_' + roomName);
            }
        }

        let bannedDevices = loadRoomBannedDevices(activeRoom);
        let ignoredAppeals = {};
        const pendingAppealPeers = {};

        function updateBanlistUI() {
            bannedDevices = loadRoomBannedDevices(activeRoom);
            const banKeys = Object.keys(bannedDevices);
            const count = banKeys.length;

            if (myProfile && myProfile.isAdmin) {
                banlistBtn.style.display = 'flex';
                banlistBtnText.innerText = `${dict[currentLang].bansBtn} (${count})`;
            } else {
                banlistBtn.style.display = 'none';
            }

            banlistTitleLabel.innerText = `${dict[currentLang].banlistTitle} #${activeRoom}`;
            banlistItemsContainer.innerHTML = '';

            if (count === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'banlist-empty';
                emptyDiv.innerText = dict[currentLang].banlistEmpty;
                banlistItemsContainer.appendChild(emptyDiv);
                return;
            }

            banKeys.sort((a, b) => (bannedDevices[b].timestamp || 0) - (bannedDevices[a].timestamp || 0)).forEach(devId => {
                const entry = bannedDevices[devId];
                const row = document.createElement('div');
                row.className = 'banlist-row';
                row.innerHTML = `
                    <span class="banlist-nick" title="${escapeHTML(devId)}">${escapeHTML(entry.nick || devId)}</span>
                    <button class="unban-btn">${dict[currentLang].unbanBtn}</button>
                `;
                row.querySelector('.unban-btn').onclick = () => {
                    unbanDeviceInRoom(devId);
                };
                banlistItemsContainer.appendChild(row);
            });
        }

        window.unbanDeviceInRoom = (deviceId) => {
            bannedDevices = loadRoomBannedDevices(activeRoom);
            delete bannedDevices[deviceId];
            delete ignoredAppeals[deviceId];
            saveRoomBannedDevices(activeRoom, bannedDevices);

            const notif = document.getElementById(`appeal-${deviceId}`);
            if (notif) notif.remove();

            const targetPeerId = pendingAppealPeers[deviceId];
            const unbanMsg = { type: 'appeal_accepted', target: targetPeerId || '', deviceId: deviceId };
            if (targetPeerId) {
                sendToPeer(targetPeerId, unbanMsg);
                delete pendingAppealPeers[deviceId];
            }
            broadcastSignaling(unbanMsg);
            publishToDiscoveryBus(unbanMsg);
            showToast(dict[currentLang].unbannedToast);
        };

        function updateRoomHeaderUI() {
            roomHeaderName.innerText = activeRoom;
            const pinnedList = getPinnedRooms();
            const isPinned = pinnedList.includes(activeRoom);
            pinRoomBtn.classList.toggle('active', isPinned);
            pinBtnText.innerText = isPinned ? dict[currentLang].pinnedActive : dict[currentLang].pinBtn;

            if (myProfile.isAdmin) {
                roomRoleTag.className = 'role-badge host';
                roomRoleTag.innerText = dict[currentLang].host;
            } else {
                roomRoleTag.className = 'role-badge guest';
                roomRoleTag.innerText = dict[currentLang].guest;
            }
            updateBanlistUI();
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let peer = null;
        let localStream = null;
        let localAnalyserCloneStream = null;
        const activeConnections = {};
        const connectionAttemptTs = {};
        const activeCalls = {};
        const callStartedAt = {};
        const remotePeerReady = {};
        const remoteStreams = {};
        const remoteAudioAnalysers = {};
        const remoteAnalyserCloneStreams = {};
        const peerHealth = {};
        const peerJoinTimestamps = {};
        const reconnectLocks = {};
        let chatOpen = false;

        // Разблокировка автовоспроизведения звука на мобильных и ПК при любом клике/касании
        const unlockAudioPlayback = () => {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            document.querySelectorAll('#webrtc-audio-container audio').forEach(a => {
                if (a.paused) a.play().catch(() => {});
            });
        };
        document.addEventListener('click', unlockAudioPlayback, { passive: true });
        document.addEventListener('touchstart', unlockAudioPlayback, { passive: true });

        let savedProfileRaw = {};
        try {
            savedProfileRaw = JSON.parse(localStorage.getItem('voiceup_profile')) || {};
        } catch (e) {
            savedProfileRaw = {};
        }

        let myProfile = {
            nick: savedProfileRaw.nick || "",
            color: savedProfileRaw.color || "#ffffff",
            avatar: savedProfileRaw.avatar || "",
            isAdmin: false
        };

        function saveMyProfileToStorage() {
            localStorage.setItem('voiceup_profile', JSON.stringify({
                nick: myProfile.nick,
                color: myProfile.color,
                avatar: myProfile.avatar,
                deviceId: myProfile.deviceId
            }));
        }

        function getDeviceId() {
            let fp = localStorage.getItem('voiceup_hwid');
            if (!fp) {
                const guid = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                fp = 'hw_' + guid; 
                localStorage.setItem('voiceup_hwid', fp);
            }
            return fp;
        }
        myProfile.deviceId = getDeviceId();
        myProfile.deviceType = myDeviceType;

        let micHotkey = localStorage.getItem('voiceup_hotkey') || null; 
        let deafenHotkey = localStorage.getItem('voiceup_deafen_hotkey') || null;
        
        const userProfiles = {}; 
        const userStates = {}; 
        const localPeerSettings = {}; 
        let micEnabled = true; 
        let adminMuted = false; 
        let soundEnabled = true;
        let isAssigningMicHotkey = false; 
        let isAssigningDeafenHotkey = false;

        // ВЫБОР ЕДИНСТВЕННОГО СОЗДАТЕЛЯ / АДМИНА КОМНАТЫ С АВТО-ВОЗВРАТОМ КОРОНЫ
        function recalculateRoomAdmin() {
            if (!myId) return;

            userProfiles[myId] = myProfile;
            peerJoinTimestamps[myId] = myJoinTimestamp;

            const onlinePeers = [myId];
            Object.keys(userProfiles).forEach(pid => {
                if (pid && pid !== myId) {
                    const lastSeen = peerHealth[pid]?.lastSeen || Date.now();
                    if (Date.now() - lastSeen <= PEER_DEAD_TIMEOUT_MS) {
                        onlinePeers.push(pid);
                    }
                }
            });

            if (!roomCreatorDeviceId) {
                const savedCreator = localStorage.getItem('voiceup_creator_' + activeRoom);
                if (savedCreator) {
                    roomCreatorDeviceId = savedCreator;
                } else if (onlinePeers.length === 1) {
                    roomCreatorDeviceId = myProfile.deviceId;
                    localStorage.setItem('voiceup_creator_' + activeRoom, roomCreatorDeviceId);
                }
            }

            let electedAdminId = "";

            // 1) Если настоящий создатель комнаты (roomCreatorDeviceId) сейчас онлайн — корона принадлежит строго ему!
            if (roomCreatorDeviceId) {
                for (let i = 0; i < onlinePeers.length; i++) {
                    const pid = onlinePeers[i];
                    const prof = pid === myId ? myProfile : userProfiles[pid];
                    if (prof && prof.deviceId === roomCreatorDeviceId) {
                        electedAdminId = pid;
                        break;
                    }
                }
            }

            // 2) Если создатель вышел — права временно у того, кто зашел раньше всех (минимальный joinTimestamp)
            if (!electedAdminId) {
                const sorted = [...onlinePeers].sort((a, b) => {
                    const tsA = peerJoinTimestamps[a] || Number.MAX_SAFE_INTEGER;
                    const tsB = peerJoinTimestamps[b] || Number.MAX_SAFE_INTEGER;
                    if (Math.abs(tsA - tsB) > 200) return tsA - tsB;
                    return String(a).localeCompare(String(b));
                });
                electedAdminId = sorted[0] || myId;
            }

            currentAdminPeerId = electedAdminId;
            myProfile.isAdmin = (currentAdminPeerId === myId);

            Object.keys(userProfiles).forEach(pid => {
                if (userProfiles[pid]) {
                    userProfiles[pid].isAdmin = (pid === currentAdminPeerId);
                }
            });

            updateRoomHeaderUI();

            if (document.getElementById(`card-${myId}`)) {
                updateCardVisuals(myId, myProfile, true);
            }
            Object.keys(userProfiles).forEach(pid => {
                if (pid !== myId && document.getElementById(`card-${pid}`)) {
                    updateCardVisuals(pid, userProfiles[pid], false);
                }
            });
        }

        function syncCreatorDeviceId(incomingCreatorId, senderPeerId, senderJoinTs) {
            if (!incomingCreatorId) return;
            if (!roomCreatorDeviceId) {
                roomCreatorDeviceId = incomingCreatorId;
                localStorage.setItem('voiceup_creator_' + activeRoom, roomCreatorDeviceId);
                return;
            }
            if (roomCreatorDeviceId !== incomingCreatorId) {
                const myTs = myJoinTimestamp || Number.MAX_SAFE_INTEGER;
                const remoteTs = senderJoinTs || peerJoinTimestamps[senderPeerId] || Number.MAX_SAFE_INTEGER;
                if (remoteTs < myTs - 150 || (Math.abs(remoteTs - myTs) <= 150 && String(senderPeerId) < String(myId))) {
                    roomCreatorDeviceId = incomingCreatorId;
                    localStorage.setItem('voiceup_creator_' + activeRoom, roomCreatorDeviceId);
                }
            }
        }

        function shouldInitiateCall(peerA, peerB) {
            return String(peerA) > String(peerB);
        }

        function broadcastSignaling(msgObj) {
            for (const pid in activeConnections) {
                if (activeConnections[pid] && activeConnections[pid].open) {
                    try { activeConnections[pid].send(msgObj); } catch(e) {}
                }
            }
            publishToDiscoveryBus(msgObj);
        }

        function sendToPeer(targetId, msgObj) {
            if (activeConnections[targetId] && activeConnections[targetId].open) {
                try { activeConnections[targetId].send(msgObj); } catch(e) {}
            } else {
                publishToDiscoveryBus({ ...msgObj, target: targetId });
            }
        }

        function showToast(msg) {
            toastNotif.innerText = msg;
            toastNotif.classList.add('show');
            setTimeout(() => { toastNotif.classList.remove('show'); }, 1800);
        }

        // =========================================================================
        // МНОГОКАНАЛЬНАЯ СИСТЕМА ОБНАРУЖЕНИЯ УЧАСТНИКОВ (DISCOVERY BUS)
        // 1) MQTT over WSS (EMQX + HiveMQ) — мгновенная синхронизация через интернет (< 200ms)
        // 2) ntfy.sh WSS Stream — резервный независимый HTTPS/WSS канал
        // 3) BroadcastChannel — мгновенная синхронизация между вкладками
        // =========================================================================
        function buildPresencePacket(packetType = 'presence') {
            return {
                type: packetType,
                room: activeRoom,
                id: myId,
                peerReady: Boolean(isMyPeerOpen && peer && !peer.destroyed && !peer.disconnected),
                deviceId: myProfile.deviceId,
                profile: myProfile,
                state: userStates[myId] || { mic: micEnabled && !adminMuted, deaf: !soundEnabled, adminMuted: adminMuted },
                joinTimestamp: myJoinTimestamp,
                creatorDeviceId: roomCreatorDeviceId,
                knownPeers: Object.keys(userProfiles),
                ts: Date.now()
            };
        }

        function getDiscoveryTopic() {
            return `voiceup_v4_sync_${activeRoom}`;
        }

        function publishToDiscoveryBus(payload) {
            if (!payload || !activeRoom) return;
            const jsonStr = JSON.stringify({ ...payload, room: activeRoom, senderId: myId });
            const topic = `voiceup/v4/room/${activeRoom}`;

            // 1. Отправка во все открытые MQTT WSS брокеры
            mqttClients.forEach(client => {
                try {
                    if (client && client.connected) {
                        client.publish(topic, jsonStr, { qos: 0 });
                    }
                } catch (e) {}
            });

            // 2. Отправка в локальный BroadcastChannel (между вкладками одного браузера)
            try {
                if (localBroadcastChannel) {
                    localBroadcastChannel.postMessage(jsonStr);
                }
            } catch (e) {}
        }

        function publishNtfyEvent(payload) {
            try {
                fetch(`https://ntfy.sh/${getDiscoveryTopic()}`, {
                    method: 'POST',
                    body: JSON.stringify({ ...payload, room: activeRoom, senderId: myId })
                }).catch(() => {});
            } catch (e) {}
        }

        function handleDiscoveryPacket(raw) {
            if (!raw) return;
            let data = raw;
            if (typeof raw === 'string') {
                try { data = JSON.parse(raw); } catch (e) { return; }
            }
            if (!data || typeof data !== 'object') return;
            if (data.room && data.room !== activeRoom) return;

            const remoteId = data.id || data.senderId;
            if (!remoteId || remoteId === myId) return;

            if (typeof data.peerReady === 'boolean') {
                remotePeerReady[remoteId] = data.peerReady;
            }

            // Если это системный сигнал (leave, chat, status, admin_*, appeal_*, check_ban_status, request_call_me)
            if (data.type && data.type !== 'presence' && data.type !== 'presence_ack') {
                if (!data.target || data.target === myId || myProfile.isAdmin) {
                    handleIncomingSignal(remoteId, data);
                }
                return;
            }

            // Обработка пакета присутствия (presence / presence_ack)
            if (isInRoom) {
                onRemotePeerDiscovered(remoteId, data);
                if (data.type === 'presence') {
                    // Мгновенно отвечаем своим присутствием, чтобы новый участник увидел нас за < 200ms
                    publishToDiscoveryBus(buildPresencePacket('presence_ack'));
                }
            }
        }

        function onRemotePeerDiscovered(remoteId, data) {
            if (!remoteId || remoteId === myId || !isInRoom) return;

            const incomingProfile = data.profile || userProfiles[remoteId] || {
                nick: dict[currentLang].guest,
                color: '#ffffff',
                avatar: '',
                deviceType: 'pc',
                deviceId: data.deviceId || ''
            };

            // Проверка бана для текущей комнаты
            if (myProfile.isAdmin && incomingProfile.deviceId) {
                bannedDevices = loadRoomBannedDevices(activeRoom);
                if (bannedDevices[incomingProfile.deviceId]) {
                    pendingAppealPeers[incomingProfile.deviceId] = remoteId;
                    const rejectMsg = { type: 'banned_reject', target: remoteId, deviceId: incomingProfile.deviceId, senderName: myProfile.nick };
                    sendToPeer(remoteId, rejectMsg);
                    publishToDiscoveryBus(rejectMsg);
                    return;
                }
            }

            if (typeof data.joinTimestamp === 'number' && data.joinTimestamp > 0) {
                peerJoinTimestamps[remoteId] = data.joinTimestamp;
            }
            if (data.creatorDeviceId) {
                syncCreatorDeviceId(data.creatorDeviceId, remoteId, data.joinTimestamp);
            }
            if (typeof data.peerReady === 'boolean') {
                remotePeerReady[remoteId] = data.peerReady;
            } else if (remotePeerReady[remoteId] === undefined) {
                remotePeerReady[remoteId] = true;
            }

            if (!peerHealth[remoteId]) {
                peerHealth[remoteId] = { lastSeen: Date.now(), rtt: 35, quality: 'good', reconnecting: false, discoveredAt: Date.now() };
            } else {
                peerHealth[remoteId].lastSeen = Date.now();
                if (!peerHealth[remoteId].discoveredAt) peerHealth[remoteId].discoveredAt = Date.now();
            }

            userProfiles[remoteId] = incomingProfile;
            if (data.state) {
                userStates[remoteId] = data.state;
            } else if (!userStates[remoteId]) {
                userStates[remoteId] = { mic: true, deaf: false, adminMuted: false };
            }

            // МГНОВЕННО добавляем карточку друга на экран комнаты!
            addUserCard(remoteId, incomingProfile, false);
            recalculateRoomAdmin();

            // Устанавливаем прямое P2P DataConnection и Голосовой звонок ТОЛЬКО когда оба PeerJS узла открыты на сервере
            if (isMyPeerOpen && remotePeerReady[remoteId] !== false) {
                connectDataToPeer(remoteId);
                ensureVoiceConnectionWithPeer(remoteId);
            }
        }

        function startMultiBrokerDiscovery() {
            stopMultiBrokerDiscovery();

            // 1. Локальный BroadcastChannel
            try {
                if (typeof BroadcastChannel !== 'undefined') {
                    localBroadcastChannel = new BroadcastChannel(`voiceup_bc_${activeRoom}`);
                    localBroadcastChannel.onmessage = (ev) => handleDiscoveryPacket(ev.data);
                }
            } catch (e) {}

            // 2. MQTT over WSS (параллельно EMQX и HiveMQ для 100% надежности)
            if (typeof mqtt !== 'undefined') {
                const brokers = [
                    'wss://broker.emqx.io:8084/mqtt',
                    'wss://broker.hivemq.com:8884/mqtt'
                ];
                const topic = `voiceup/v4/room/${activeRoom}`;

                brokers.forEach(brokerUrl => {
                    try {
                        const client = mqtt.connect(brokerUrl, {
                            clientId: 'vup_' + Math.random().toString(36).substring(2, 10),
                            clean: true,
                            connectTimeout: 4000,
                            reconnectPeriod: 3000
                        });
                        client.on('connect', () => {
                            client.subscribe(topic, { qos: 0 }, () => {
                                if (isInRoom && myId) {
                                    publishToDiscoveryBus(buildPresencePacket('presence'));
                                }
                            });
                        });
                        client.on('message', (t, messageBuf) => {
                            try {
                                handleDiscoveryPacket(messageBuf.toString());
                            } catch (e) {}
                        });
                        mqttClients.push(client);
                    } catch (e) {}
                });
            }

            // 3. Независимый WebSocket поток ntfy.sh
            try {
                ntfySocket = new WebSocket(`wss://ntfy.sh/${getDiscoveryTopic()}/ws`);
                ntfySocket.onopen = () => {
                    if (isInRoom && myId) {
                        publishNtfyEvent(buildPresencePacket('presence'));
                    }
                };
                ntfySocket.onmessage = (ev) => {
                    try {
                        const wrapper = JSON.parse(ev.data);
                        if (wrapper && wrapper.event === 'message' && wrapper.message) {
                            handleDiscoveryPacket(wrapper.message);
                        }
                    } catch (e) {}
                };
            } catch (e) {}
        }

        function stopMultiBrokerDiscovery() {
            mqttClients.forEach(c => {
                try { c.end(true); } catch (e) {}
            });
            mqttClients = [];

            if (ntfySocket) {
                try { ntfySocket.close(); } catch (e) {}
                ntfySocket = null;
            }
            if (localBroadcastChannel) {
                try { localBroadcastChannel.close(); } catch (e) {}
                localBroadcastChannel = null;
            }
        }

        // ПРОВЕРКА, ИДЕТ ЛИ СЕЙЧАС УСТАНОВКА ИЛИ РАБОТА ЗВОНКА (ЧТОБЫ НЕ УБИВАТЬ ЗВОНОК ВО ВРЕМЯ СБОРКИ ICE!)
        function isCallHealthyOrNegotiating(remoteId) {
            const call = activeCalls[remoteId];
            if (!call) return false;

            const pc = call.peerConnection;
            const ice = pc ? pc.iceConnectionState : '';
            const conn = pc ? pc.connectionState : '';
            const age = Date.now() - (callStartedAt[remoteId] || 0);

            if (ice === 'failed' || ice === 'closed' || conn === 'failed' || conn === 'closed') {
                return false;
            }
            if (remoteStreams[remoteId] && (ice === 'connected' || ice === 'completed' || conn === 'connected')) {
                return true;
            }
            // Даем звонку полные 9 секунд (CALL_NEGOTIATION_GRACE_MS) на сборку STUN/TURN кандидатов без прерываний!
            if (age < CALL_NEGOTIATION_GRACE_MS) {
                return true;
            }
            return Boolean(remoteStreams[remoteId] && ice !== 'disconnected');
        }

        // НАДЕЖНАЯ УСТАНОВКА ГОЛОСОВОГО КАНАЛА БЕЗ GLARE-КОЛЛИЗИЙ И ПРЕЖДЕВРЕМЕННОГО СБРОСА
        function ensureVoiceConnectionWithPeer(remoteId) {
            if (!isInRoom || !isMyPeerOpen || !peer || peer.destroyed || !localStream || !remoteId || remoteId === myId) return;
            if (remotePeerReady[remoteId] === false) return;

            // Если звонок уже работает или находится в процессе установки ICE (< 9 сек) — НЕ ТРОГАЕМ ЕГО!
            if (isCallHealthyOrNegotiating(remoteId)) return;

            const discoveredAt = peerHealth[remoteId]?.discoveredAt || Date.now();
            const timeSinceDiscovery = Date.now() - discoveredAt;
            const iAmPrimaryCaller = shouldInitiateCall(myId, remoteId);

            if (iAmPrimaryCaller) {
                // Инициатор звонит сразу
                callVoicePeer(remoteId, true);
            } else if (timeSinceDiscovery > 4500 && !activeCalls[remoteId] && !remoteStreams[remoteId]) {
                // Если мы ведомый, но за 4.5 секунды звонок от инициатора так и не пришел — просим его позвонить и звоним сами!
                sendToPeer(remoteId, { type: 'request_voice_reconnect', id: myId });
                callVoicePeer(remoteId, true);
            }
        }

        // ПОСТОЯННЫЙ ЦИКЛ ПОДДЕРЖАНИЯ СВЯЗИ И СИНХРОНИЗАЦИИ (HEARTBEAT + PRESENCE + AUDIO WATCHDOG)
        function runPresenceAndHeartbeatCycle() {
            if (!isInRoom || !myId) return;

            // 1. Рассылаем свое присутствие по всем каналам Discovery Bus
            publishToDiscoveryBus(buildPresencePacket('presence'));

            // 2. Проверяем, чтобы все <audio> элементы воспроизводились и не вставали на паузу
            document.querySelectorAll('#webrtc-audio-container audio').forEach(audioEl => {
                audioEl.muted = !soundEnabled;
                if (audioEl.paused && audioEl.srcObject) {
                    audioEl.play().catch(() => {});
                }
            });

            if (!peer || peer.destroyed) return;

            if (peer.disconnected && !peer.destroyed) {
                isMyPeerOpen = false;
                updateNetQualityDOM(myId, 'bad', 999);
                try { peer.reconnect(); } catch (e) {}
                return;
            } else if (peer.open) {
                isMyPeerOpen = true;
                updateNetQualityDOM(myId, 'good', 0);
            }

            const now = Date.now();

            // 3. Пингуем всех участников комнаты и контролируем голосовые потоки
            Object.keys(userProfiles).forEach(pid => {
                if (!pid || pid === myId) return;
                if (!peerHealth[pid]) {
                    peerHealth[pid] = { lastSeen: now, rtt: 35, quality: 'good', reconnecting: false, discoveredAt: now };
                }

                if (isMyPeerOpen && remotePeerReady[pid] !== false) {
                    const conn = activeConnections[pid];
                    if (!conn || !conn.open) {
                        connectDataToPeer(pid);
                    } else {
                        try {
                            conn.send({
                                type: 'ping',
                                id: myId,
                                ts: now,
                                joinTimestamp: myJoinTimestamp,
                                creatorDeviceId: roomCreatorDeviceId
                            });
                        } catch (e) {}
                    }

                    // Проверяем голосовой канал (не прерывая идущую установку ICE!)
                    ensureVoiceConnectionWithPeer(pid);
                }

                const call = activeCalls[pid];
                if (call && call.peerConnection) {
                    try {
                        call.peerConnection.getStats().then(stats => {
                            stats.forEach(report => {
                                if (report.type === 'candidate-pair' && report.state === 'succeeded' && typeof report.currentRoundTripTime === 'number') {
                                    const statsRtt = Math.round(report.currentRoundTripTime * 1000);
                                    if (statsRtt > 0) {
                                        applyRttMeasurement(pid, statsRtt);
                                    }
                                }
                            });
                        }).catch(() => {});
                    } catch (e) {}
                }

                const elapsed = now - peerHealth[pid].lastSeen;
                if (elapsed > PEER_DEAD_TIMEOUT_MS) {
                    cleanupPeer(pid);
                } else if (elapsed > PEER_STALE_TIMEOUT_MS) {
                    updateNetQualityDOM(pid, 'bad', Math.min(999, Math.round(elapsed / 10)));
                    triggerSoftPeerReconnect(pid);
                }
            });

            recalculateRoomAdmin();
        }

        function startPresenceLoop() {
            if (presenceTimer) clearInterval(presenceTimer);
            runPresenceAndHeartbeatCycle();
            presenceTimer = setInterval(runPresenceAndHeartbeatCycle, PRESENCE_INTERVAL_MS);
        }

        function applyRttMeasurement(peerId, rttMs) {
            if (!peerHealth[peerId]) {
                peerHealth[peerId] = { lastSeen: Date.now(), rtt: rttMs, quality: 'good', reconnecting: false, discoveredAt: Date.now() };
            }
            peerHealth[peerId].rtt = rttMs;
            let q = 'good';
            if (rttMs > 260) q = 'bad';
            else if (rttMs > 120) q = 'medium';
            updateNetQualityDOM(peerId, q, rttMs);
        }

        // МЯГКОЕ ПЕРЕПОДКЛЮЧЕНИЕ WEBRTC ПРИ РЕАЛЬНОМ ОБРЫВЕ СВЯЗИ
        function triggerSoftPeerReconnect(remoteId) {
            if (!isMyPeerOpen || !peer || peer.destroyed || !remoteId || remoteId === myId) return;
            if (reconnectLocks[remoteId]) return;
            if (isCallHealthyOrNegotiating(remoteId)) return;

            reconnectLocks[remoteId] = true;
            updateNetQualityDOM(remoteId, 'bad', peerHealth[remoteId]?.rtt || 450);

            const existingConn = activeConnections[remoteId];
            if (!existingConn || !existingConn.open) {
                try { if (existingConn) existingConn.close(); } catch (e) {}
                delete activeConnections[remoteId];
                delete connectionAttemptTs[remoteId];
                connectDataToPeer(remoteId);
            }

            if (shouldInitiateCall(myId, remoteId)) {
                callVoicePeer(remoteId, true);
            } else {
                sendToPeer(remoteId, {
                    type: 'request_voice_reconnect',
                    id: myId,
                    profile: myProfile,
                    state: userStates[myId] || { mic: micEnabled && !adminMuted, deaf: !soundEnabled, adminMuted: adminMuted },
                    creatorDeviceId: roomCreatorDeviceId
                });
            }

            setTimeout(() => {
                delete reconnectLocks[remoteId];
            }, 6000);
        }

        // ОБРАБОТЧИК СИГНАЛОВ МЕЖДУ УЧАСТНИКАМИ
        function handleIncomingSignal(remoteId, message) {
            if (!message || typeof message !== 'object') return;
            const peerId = message.id || message.senderId || remoteId;
            if (!peerId || peerId === myId) return;

            if (!peerHealth[peerId]) {
                peerHealth[peerId] = { lastSeen: Date.now(), rtt: 35, quality: 'good', reconnecting: false, discoveredAt: Date.now() };
            } else {
                peerHealth[peerId].lastSeen = Date.now();
            }

            remotePeerReady[peerId] = true;

            if (typeof message.joinTimestamp === 'number' && message.joinTimestamp > 0) {
                peerJoinTimestamps[peerId] = message.joinTimestamp;
            }
            if (message.creatorDeviceId) {
                syncCreatorDeviceId(message.creatorDeviceId, peerId, message.joinTimestamp);
            }

            // Heartbeat Ping / Pong
            if (message.type === 'ping') {
                sendToPeer(peerId, {
                    type: 'pong',
                    id: myId,
                    ts: message.ts,
                    joinTimestamp: myJoinTimestamp,
                    creatorDeviceId: roomCreatorDeviceId
                });
                recalculateRoomAdmin();
                return;
            }

            if (message.type === 'pong') {
                const rtt = Math.max(1, Date.now() - (message.ts || Date.now()));
                applyRttMeasurement(peerId, rtt);
                recalculateRoomAdmin();
                return;
            }

            if (message.type === 'request_voice_reconnect') {
                if (!isCallHealthyOrNegotiating(peerId)) {
                    callVoicePeer(peerId, true);
                }
                return;
            }

            if (message.type === 'check_ban_status') {
                if (myProfile.isAdmin) {
                    bannedDevices = loadRoomBannedDevices(activeRoom);
                    if (!bannedDevices[message.deviceId]) {
                        const acceptMsg = { type: 'appeal_accepted', target: peerId, deviceId: message.deviceId };
                        sendToPeer(peerId, acceptMsg);
                        publishToDiscoveryBus(acceptMsg);
                    } else {
                        pendingAppealPeers[message.deviceId] = peerId;
                    }
                }
                return;
            }

            const peerProfile = message.profile || userProfiles[peerId] || { nick: dict[currentLang].guest, color: '#ffffff', avatar: '', deviceType: 'pc' };

            // Проверка бана для текущей комнаты
            if (myProfile.isAdmin && (message.type === 'join' || message.type === 'handshake' || message.type === 'handshake_reply')) {
                bannedDevices = loadRoomBannedDevices(activeRoom);
                if (peerProfile.deviceId && bannedDevices[peerProfile.deviceId]) {
                    pendingAppealPeers[peerProfile.deviceId] = peerId;
                    const rejectMsg = { type: 'banned_reject', target: peerId, deviceId: peerProfile.deviceId, senderName: myProfile.nick };
                    sendToPeer(peerId, rejectMsg);
                    publishToDiscoveryBus(rejectMsg);
                    return;
                }
            }

            // Апелляция бана
            if (message.type === 'ban_appeal') {
                if (!myProfile.isAdmin) return;

                pendingAppealPeers[message.deviceId] = peerId;
                bannedDevices = loadRoomBannedDevices(activeRoom);
                if (!bannedDevices[message.deviceId]) {
                    const acceptMsg = { type: 'appeal_accepted', target: peerId, deviceId: message.deviceId };
                    sendToPeer(peerId, acceptMsg);
                    publishToDiscoveryBus(acceptMsg);
                    return;
                }

                if (ignoredAppeals[message.deviceId]) return; 
                const notifId = `appeal-${message.deviceId}`; 
                if (document.getElementById(notifId)) return; 
                const notif = document.createElement('div'); 
                notif.id = notifId; 
                notif.className = 'appeal-card';
                notif.innerHTML = `<div style="font-size:13px; margin-bottom:10px;"><b>${escapeHTML(message.nick)}</b> ${dict[currentLang].wantsToJoin}.</div><div style="display:flex; gap:6px;"><button class="primary-btn" style="padding:6px; font-size:11px;" onclick="acceptAppeal('${peerId}', '${message.deviceId}')">${dict[currentLang].letIn}</button><button class="secondary-btn" style="padding:6px; font-size:11px; border-color:var(--danger); color:var(--danger);" onclick="ignoreAppeal('${message.deviceId}')">${dict[currentLang].hide}</button></div>`;
                document.getElementById('admin-notifications').appendChild(notif); 
                return;
            }

            if (message.type === 'banned_reject' && (message.target === myId || message.deviceId === myProfile.deviceId)) {
                setClientBannedInRoom(activeRoom, true);
                showBannedScreen();
                return;
            }

            if (message.type === 'admin_kick') {
                if (message.target === myId || (message.targetDeviceId && message.targetDeviceId === myProfile.deviceId)) {
                    setClientBannedInRoom(activeRoom, true);
                    broadcastSignaling({ type: 'leave', id: myId });
                    showBannedScreen();
                } else {
                    if (message.targetDeviceId && message.targetNick && myProfile.isAdmin) {
                        bannedDevices = loadRoomBannedDevices(activeRoom);
                        bannedDevices[message.targetDeviceId] = {
                            nick: message.targetNick,
                            deviceId: message.targetDeviceId,
                            timestamp: Date.now()
                        };
                        saveRoomBannedDevices(activeRoom, bannedDevices);
                    }
                    cleanupPeer(message.target);
                    playUiSound('leave');
                }
                return;
            }

            if (message.type === 'appeal_accepted' && (message.target === myId || message.deviceId === myProfile.deviceId)) {
                setClientBannedInRoom(activeRoom, false);
                window.location.reload();
                return;
            }

            if (message.type === 'leave' || message.type === 'peer_left') {
                const targetToClean = message.id || peerId;
                if (userProfiles[targetToClean]) {
                    cleanupPeer(targetToClean);
                    playUiSound('leave');
                    recalculateRoomAdmin();
                }
                return;
            }

            if (message.type === 'admin_mute' && message.target === myId) { 
                adminMuted = true; 
                updateMicHardware(); 
                return; 
            }
            if (message.type === 'admin_unmute' && message.target === myId) { 
                adminMuted = false; 
                updateMicHardware(); 
                return; 
            }

            if (message.type === 'status') { 
                userStates[peerId] = message.state; 
                if (userProfiles[peerId]) {
                    updateCardVisuals(peerId, userProfiles[peerId], false); 
                }
                return; 
            }

            if (message.type === 'update-profile') { 
                userProfiles[peerId] = peerProfile; 
                recalculateRoomAdmin();
                updateCardVisuals(peerId, userProfiles[peerId], false); 
                return; 
            }

            if (message.type === 'join' || message.type === 'handshake' || message.type === 'handshake_reply') {
                onRemotePeerDiscovered(peerId, message);
                if (message.type === 'join' || message.type === 'handshake') {
                    sendToPeer(peerId, {
                        type: 'handshake_reply',
                        id: myId,
                        peerReady: isMyPeerOpen,
                        profile: myProfile,
                        state: userStates[myId] || { mic: micEnabled && !adminMuted, deaf: !soundEnabled, adminMuted: adminMuted },
                        joinTimestamp: myJoinTimestamp,
                        creatorDeviceId: roomCreatorDeviceId
                    });
                }
                return;
            }

            if (message.type === 'chat') {
                if (!message._chatId || !seenChatIds.has(message._chatId)) {
                    if (message._chatId) seenChatIds.add(message._chatId);
                    handleIncomingMessage(peerId, message.data);
                }
            }
        }

        const seenChatIds = new Set();

        function attachPeerConnectionMonitors(pc, remoteId) {
            if (!pc) return;

            // Прямой перехват аудио-трека на уровне RTCPeerConnection (на случай если PeerJS задержит событие 'stream')
            pc.addEventListener('track', (event) => {
                const stream = (event.streams && event.streams[0]) ? event.streams[0] : new MediaStream([event.track]);
                if (stream && stream.getAudioTracks().length > 0) {
                    remoteStreams[remoteId] = stream;
                    attachRemoteAudio(remoteId, stream);
                    if (peerHealth[remoteId]) peerHealth[remoteId].lastSeen = Date.now();
                    updateNetQualityDOM(remoteId, 'good', peerHealth[remoteId]?.rtt || 30);
                }
            });

            const handleStateChange = () => {
                const ice = pc.iceConnectionState;
                const conn = pc.connectionState;
                if (ice === 'connected' || ice === 'completed' || conn === 'connected') {
                    if (peerHealth[remoteId]) peerHealth[remoteId].lastSeen = Date.now();
                    updateNetQualityDOM(remoteId, 'good', peerHealth[remoteId]?.rtt || 32);
                } else if (ice === 'failed' || conn === 'failed') {
                    updateNetQualityDOM(remoteId, 'bad', 999);
                    triggerSoftPeerReconnect(remoteId);
                } else if (ice === 'disconnected' || conn === 'disconnected') {
                    updateNetQualityDOM(remoteId, 'bad', 400);
                    setTimeout(() => {
                        if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
                            triggerSoftPeerReconnect(remoteId);
                        }
                    }, 4500);
                }
            };
            pc.addEventListener('iceconnectionstatechange', handleStateChange);
            pc.addEventListener('connectionstatechange', handleStateChange);
        }

        function bindMediaCallHandlers(call, remoteId) {
            if (!call || !remoteId) return;
            activeCalls[remoteId] = call;
            callStartedAt[remoteId] = Date.now();

            if (call.peerConnection) {
                attachPeerConnectionMonitors(call.peerConnection, remoteId);
            } else {
                setTimeout(() => {
                    if (call.peerConnection) attachPeerConnectionMonitors(call.peerConnection, remoteId);
                }, 50);
            }

            call.on('stream', (stream) => {
                if (!stream) return;
                remoteStreams[remoteId] = stream;
                attachRemoteAudio(remoteId, stream);
                if (peerHealth[remoteId]) peerHealth[remoteId].lastSeen = Date.now();
                updateNetQualityDOM(remoteId, 'good', peerHealth[remoteId]?.rtt || 30);
            });

            call.on('close', () => {
                if (activeCalls[remoteId] === call) {
                    delete activeCalls[remoteId];
                    delete callStartedAt[remoteId];
                    delete remoteStreams[remoteId];
                }
            });

            call.on('error', () => {
                if (activeCalls[remoteId] === call) {
                    delete activeCalls[remoteId];
                    delete callStartedAt[remoteId];
                    delete remoteStreams[remoteId];
                }
            });
        }

        function callVoicePeer(remoteId, forceCall) {
            if (!isMyPeerOpen || !peer || peer.destroyed || !localStream || !remoteId || remoteId === myId) return;
            if (!forceCall && isCallHealthyOrNegotiating(remoteId)) return;

            if (activeCalls[remoteId]) {
                // Если звонок уже открыт или собирает ICE меньше 9 секунд — не убиваем его!
                if (isCallHealthyOrNegotiating(remoteId)) return;
                try { activeCalls[remoteId].close(); } catch (e) {}
                delete activeCalls[remoteId];
                delete callStartedAt[remoteId];
            }

            try {
                // Гарантируем, что локальный аудио-трек включен в соответствии с кнопкой микрофона
                const actualMic = micEnabled && !adminMuted;
                localStream.getAudioTracks().forEach(t => { t.enabled = actualMic; });

                const call = peer.call(remoteId, localStream);
                if (call) {
                    bindMediaCallHandlers(call, remoteId);
                }
            } catch(e) {}
        }

        function bindPeerEvents() {
            peer.on('connection', (conn) => {
                setupDataConnection(conn);
            });

            peer.on('call', (call) => {
                if (!localStream || !call || !call.peer) return;
                const remoteId = call.peer;

                // Если у нас был свой исходящий звонок, который еще не получил аудиопоток, закрываем старый и принимаем входящий
                if (activeCalls[remoteId] && activeCalls[remoteId] !== call && !remoteStreams[remoteId]) {
                    try { activeCalls[remoteId].close(); } catch (e) {}
                }

                const actualMic = micEnabled && !adminMuted;
                localStream.getAudioTracks().forEach(t => { t.enabled = actualMic; });

                call.answer(localStream);
                bindMediaCallHandlers(call, remoteId);
            });

            peer.on('disconnected', () => {
                isMyPeerOpen = false;
                updateNetQualityDOM(myId, 'bad', 999);
                setTimeout(() => {
                    if (peer && peer.disconnected && !peer.destroyed) {
                        try { peer.reconnect(); } catch (e) {}
                    }
                }, 600);
            });

            peer.on('error', (err) => {
                if (err && err.type === 'peer-unavailable') return;
                console.warn('Peer warning:', err ? err.type : '');
            });
        }

        function connectDataToPeer(targetId) {
            if (!isMyPeerOpen || !peer || peer.destroyed || !targetId || targetId === myId) return;
            const existing = activeConnections[targetId];
            if (existing && existing.open) return;

            const now = Date.now();
            if (now - (connectionAttemptTs[targetId] || 0) < 3500) return;

            if (existing && !existing.open) {
                try { existing.close(); } catch (e) {}
                delete activeConnections[targetId];
            }

            try {
                connectionAttemptTs[targetId] = now;
                const conn = peer.connect(targetId, { reliable: true });
                setupDataConnection(conn);
            } catch (e) {}
        }

        function setupDataConnection(conn) {
            if (!conn || !conn.peer) return;
            const remoteId = conn.peer;

            if (!activeConnections[remoteId] || !activeConnections[remoteId].open) {
                activeConnections[remoteId] = conn;
            }

            conn.on('open', () => {
                activeConnections[remoteId] = conn;
                remotePeerReady[remoteId] = true;
                connectionAttemptTs[remoteId] = Date.now();
                if (!peerHealth[remoteId]) {
                    peerHealth[remoteId] = { lastSeen: Date.now(), rtt: 35, quality: 'good', reconnecting: false, discoveredAt: Date.now() };
                } else {
                    peerHealth[remoteId].lastSeen = Date.now();
                }

                try {
                    conn.send({
                        type: 'handshake',
                        id: myId,
                        peerReady: isMyPeerOpen,
                        profile: myProfile,
                        state: userStates[myId] || { mic: micEnabled && !adminMuted, deaf: !soundEnabled, adminMuted: adminMuted },
                        joinTimestamp: myJoinTimestamp,
                        creatorDeviceId: roomCreatorDeviceId
                    });
                } catch (e) {}

                ensureVoiceConnectionWithPeer(remoteId);
            });

            conn.on('data', (data) => {
                handleIncomingSignal(conn.peer, data);
            });

            conn.on('close', () => {
                if (activeConnections[remoteId] === conn) {
                    delete activeConnections[remoteId];
                    delete connectionAttemptTs[remoteId];
                }
            });

            conn.on('error', () => {
                if (activeConnections[remoteId] === conn) {
                    delete activeConnections[remoteId];
                    delete connectionAttemptTs[remoteId];
                }
            });
        }

        function cleanupCall(peerId) {
            if (activeCalls[peerId]) {
                try { activeCalls[peerId].close(); } catch(e) {}
                delete activeCalls[peerId];
            }
            delete callStartedAt[peerId];
            delete remoteStreams[peerId];
            const a = document.getElementById(`audio-${peerId}`);
            if (a) {
                try { a.srcObject = null; } catch (e) {}
                a.remove();
            }
            if (remoteAudioAnalysers[peerId]) {
                try { remoteAudioAnalysers[peerId].disconnect(); } catch(e) {}
                delete remoteAudioAnalysers[peerId];
            }
            if (remoteAnalyserCloneStreams[peerId]) {
                try { remoteAnalyserCloneStreams[peerId].getTracks().forEach(t => t.stop()); } catch (e) {}
                delete remoteAnalyserCloneStreams[peerId];
            }
        }

        function cleanupPeer(peerId) {
            delete activeConnections[peerId];
            delete connectionAttemptTs[peerId];
            delete remotePeerReady[peerId];
            delete peerHealth[peerId];
            delete peerJoinTimestamps[peerId];
            delete reconnectLocks[peerId];
            cleanupCall(peerId);
            delete userProfiles[peerId];
            delete userStates[peerId];
            removeUserCard(peerId);
            recalculateRoomAdmin();
        }

        // НАДЕЖНОЕ ПОДКЛЮЧЕНИЕ ВХОДЯЩЕГО АУДИОПОТОКА
        function attachRemoteAudio(peerId, remoteStream) {
            if (!remoteStream) return;

            // Включаем все входящие аудио-треки
            remoteStream.getAudioTracks().forEach(t => {
                t.enabled = true;
            });

            let audio = document.getElementById(`audio-${peerId}`);
            if (!audio) {
                audio = document.createElement('audio');
                audio.id = `audio-${peerId}`;
                audio.autoplay = true;
                audio.playsInline = true;
                audio.setAttribute('playsinline', '');
                audio.setAttribute('autoplay', '');
                document.getElementById('webrtc-audio-container').appendChild(audio);
            }

            if (audio.srcObject !== remoteStream) {
                audio.srcObject = remoteStream;
            }

            const vol = localPeerSettings[peerId] ? localPeerSettings[peerId].volume : 1;
            const isMuted = localPeerSettings[peerId] ? localPeerSettings[peerId].muted : false;
            audio.volume = isMuted ? 0 : vol;
            audio.muted = !soundEnabled;

            const tryPlay = () => {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
                audio.play().catch(() => {});
            };
            audio.onloadedmetadata = tryPlay;
            tryPlay();

            setupSpeakingDetector(peerId, remoteStream);
        }

        // ИНДИКАТОР ГОЛОСА ЧЕРЕЗ CLONE() ПОТОКА (ЧТОБЫ CHROME WEBAUDIO НЕ ЗАГЛУШАЛ <AUDIO> ЭЛЕМЕНТ!)
        function setupSpeakingDetector(peerId, stream) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
                if (remoteAudioAnalysers[peerId]) {
                    try { remoteAudioAnalysers[peerId].disconnect(); } catch (e) {}
                }
                if (remoteAnalyserCloneStreams[peerId]) {
                    try { remoteAnalyserCloneStreams[peerId].getTracks().forEach(t => t.stop()); } catch (e) {}
                }

                // Клонируем поток специально для анализатора частот, не трогая основной поток в <audio>
                const clonedStream = stream.clone ? stream.clone() : stream;
                if (clonedStream !== stream) {
                    remoteAnalyserCloneStreams[peerId] = clonedStream;
                }

                const src = audioCtx.createMediaStreamSource(clonedStream);
                const analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.3;
                src.connect(analyser);
                remoteAudioAnalysers[peerId] = src;
                const data = new Uint8Array(analyser.frequencyBinCount);

                const checkVoice = () => {
                    const card = document.getElementById(`card-${peerId}`);
                    if (!card || remoteAudioAnalysers[peerId] !== src) return;
                    analyser.getByteFrequencyData(data);
                    let sum = 0;
                    for (let i = 0; i < data.length; i++) sum += data[i];
                    let avg = sum / data.length;
                    const avatar = card.querySelector('.avatar');
                    if (avatar) {
                        if (avg > 12) avatar.classList.add('speaking');
                        else avatar.classList.remove('speaking');
                    }
                    requestAnimationFrame(checkVoice);
                };
                requestAnimationFrame(checkVoice);
            } catch(e) {}
        }

        function startLocalSpeakingDetector() {
            if (!localStream) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
                if (localAnalyserCloneStream) {
                    try { localAnalyserCloneStream.getTracks().forEach(t => t.stop()); } catch (e) {}
                }
                // Клонируем локальный поток для детектора речи, чтобы основной localStream шел в WebRTC без искажений
                localAnalyserCloneStream = localStream.clone ? localStream.clone() : localStream;
                const micSource = audioCtx.createMediaStreamSource(localAnalyserCloneStream);
                const localAnalyser = audioCtx.createAnalyser();
                localAnalyser.fftSize = 256;
                localAnalyser.smoothingTimeConstant = 0.3;
                micSource.connect(localAnalyser);

                const dataArray = new Uint8Array(localAnalyser.frequencyBinCount);
                let localSpeaking = false;
                let localSpeakTimeout = null;

                const checkLocalVoice = () => {
                    if (!isInRoom) return;
                    const myCard = document.getElementById(`card-${myId}`);
                    const actualMic = micEnabled && !adminMuted;
                    
                    if (!actualMic) {
                        if (localSpeaking && myCard) {
                            localSpeaking = false;
                            myCard.querySelector('.avatar')?.classList.remove('speaking');
                        }
                        requestAnimationFrame(checkLocalVoice);
                        return;
                    }

                    localAnalyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    let avg = sum / dataArray.length;

                    if (avg > 12) {
                        if (!localSpeaking) {
                            localSpeaking = true;
                            if (myCard) myCard.querySelector('.avatar')?.classList.add('speaking');
                        }
                        clearTimeout(localSpeakTimeout);
                        localSpeakTimeout = setTimeout(() => {
                            localSpeaking = false;
                            const card = document.getElementById(`card-${myId}`);
                            if (card) card.querySelector('.avatar')?.classList.remove('speaking');
                        }, 300);
                    }
                    requestAnimationFrame(checkLocalVoice);
                };
                requestAnimationFrame(checkLocalVoice);
            } catch(e) {}
        }

            // 1. МГНОВЕННО рисуем свою карточку на экране комнаты — никакого пустого темного экрана!
            addUserCard(myId, myProfile, true);

                isMyPeerOpen = true;

                // Сразу после регистрации на PeerJS соединяемся со всеми уже найденными участниками комнаты!
                Object.keys(userProfiles).forEach(pid => {

                    }
                });
            });

        // ГРОМКИЕ ЗВУКИ УВЕДОМЛЕНИЙ В СТИЛЕ DISCORD (GAIN = 0.35)
        function playUiSound(action) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                function playTone(type, freq, tStart, tDuration, sweepFreq = null, peakGain = 0.35) {
                    const osc = audioCtx.createOscillator(); 
                    const gainNode = audioCtx.createGain();
                    osc.connect(gainNode); 
                    gainNode.connect(audioCtx.destination);
                    osc.type = type; 
                    osc.frequency.setValueAtTime(freq, tStart);
                    if (sweepFreq) osc.frequency.exponentialRampToValueAtTime(sweepFreq, tStart + tDuration);
                    gainNode.gain.setValueAtTime(0.001, tStart); 
                    gainNode.gain.linearRampToValueAtTime(peakGain, tStart + 0.015);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, tStart + tDuration); 
                    osc.start(tStart); 
                    osc.stop(tStart + tDuration + 0.01);
                }
                if (action === 'mic_on') {
                    playTone('sine', 440, now, 0.07);
                    playTone('sine', 660, now + 0.065, 0.11);
                } else if (action === 'mic_off') {
                    playTone('sine', 620, now, 0.07);
                    playTone('sine', 390, now + 0.065, 0.12);
                } else if (action === 'deafen_off') {
                    playTone('triangle', 380, now, 0.08);
                    playTone('sine', 587.33, now + 0.075, 0.12);
                } else if (action === 'deafen_on') {
                    playTone('triangle', 520, now, 0.08);
                    playTone('triangle', 293.66, now + 0.075, 0.14);
                } else if (action === 'join') {
                    playTone('sine', 523.25, now, 0.09);
                    playTone('sine', 659.25, now + 0.085, 0.16);
                } else if (action === 'leave') {
                    playTone('sine', 493.88, now, 0.09);
                    playTone('sine', 329.63, now + 0.085, 0.16);
                } else if (action === 'chat_msg') {
                    playTone('sine', 587.33, now, 0.05, 783.99);
                    playTone('sine', 880, now + 0.055, 0.08);
                }
            } catch(e) {}
        }
