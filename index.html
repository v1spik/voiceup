<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>voiceup</title>
    <meta name="description" content="P2P voice room and chat application inspired by Discord." />
    <meta property="og:title" content="voiceup" />
    <meta property="og:description" content="P2P voice room and chat application inspired by Discord." />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --bg: #000000; 
            --bg-secondary: #111111; 
            --text-main: #ffffff; 
            --text-muted: #888888; 
            --button-bg: #1c1c1c; 
            --button-hover: #2a2a2a; 
            --success: #50fa7b; 
            --warning: #f1fa8c;
            --danger: #ff5555; 
            --border-color: #282828;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; font-weight: 400; }
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            position: relative; 
        }
        .app-name { position: absolute; top: 20px; font-size: 15px; font-weight: 700; letter-spacing: 2px; text-transform: lowercase; color: var(--text-muted); }
        
        #profile-btn { position: absolute; top: 16px; left: 16px; width: 34px; height: 34px; border-radius: 50%; background-color: var(--button-bg); border: 1px solid var(--border-color); color: var(--text-muted); display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 200; transition: 0.2s; overflow: hidden; }
        #profile-btn:hover { border-color: #555; color: var(--text-main); }
        #profile-btn img { width: 100%; height: 100%; object-fit: cover; }
        
        .lang-switch { position: absolute; top: 20px; right: 20px; font-size: 12px; color: var(--text-muted); z-index: 200; user-select: none; }
        .lang-switch span { cursor: pointer; transition: color 0.2s; }
        .lang-switch span.active { color: var(--text-main); font-weight: 500; }

        /* Шапка голосовой комнаты */
        #room-header {
            position: absolute;
            top: 16px;
            display: none;
            align-items: center;
            gap: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 24px;
            z-index: 150;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }
        .room-title-box { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .room-hash { color: var(--text-muted); font-weight: 700; }
        #room-header-name { font-weight: 500; color: var(--text-main); text-transform: lowercase; }
        .role-badge { font-size: 10px; padding: 2px 6px; border-radius: 8px; font-weight: 500; text-transform: lowercase; }
        .role-badge.host { background: rgba(80, 250, 123, 0.12); color: var(--success); border: 1px solid rgba(80, 250, 123, 0.25); }
        .role-badge.guest { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid #333; }
        
        /* Таймер длительности сессии */
        .session-timer {
            font-size: 11px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.4px;
            padding-left: 7px;
            margin-left: 1px;
            border-left: 1px solid var(--border-color);
            line-height: 1;
            user-select: none;
        }

        .header-btn {
            background: var(--button-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            border-radius: 14px;
            padding: 4px 9px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: lowercase;
        }
        .header-btn:hover { color: var(--text-main); border-color: #555; background: var(--button-hover); }
        .header-btn svg { width: 12px; height: 12px; }
        .header-btn.active { color: var(--success); border-color: rgba(80, 250, 123, 0.4); }
        .header-btn.admin-ban-btn:hover { color: var(--danger); border-color: rgba(255, 85, 85, 0.5); }

        #room-screen { 
            flex: 1; 
            padding: 20px; 
            padding-top: 80px;
            padding-bottom: 120px; 
            display: flex; 
            flex-wrap: wrap; 
            align-content: center; 
            align-items: center; 
            gap: 18px; 
            justify-content: center; 
            opacity: 0; 
            transition: opacity 0.25s ease; 
            overflow-y: auto; 
            height: 100%; 
            width: 100%;
            -webkit-overflow-scrolling: touch;
        }

        #join-screen { 
            position: absolute; 
            background: var(--bg); 
            padding: 24px; 
            text-align: center; 
            z-index: 100; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            width: 100%; 
            max-width: 380px; 
        }
        h1 { font-size: 24px; font-weight: 500; text-transform: lowercase; letter-spacing: -0.5px; }

        input[type="text"] { 
            background-color: var(--bg-secondary); 
            color: var(--text-main); 
            border: 1px solid var(--border-color); 
            padding: 13px; 
            font-size: 14px; 
            border-radius: 6px; 
            width: 100%; 
            outline: none; 
            text-align: center; 
            transition: border-color 0.2s; 
        }
        input[type="text"]:focus { border-color: #555; }
        
        button.primary-btn { 
            background-color: var(--button-bg); 
            color: var(--text-main); 
            border: 1px solid #333; 
            padding: 13px 0; 
            font-size: 14px; 
            font-weight: 500; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: 0.2s; 
            text-transform: lowercase; 
            width: 100%; 
        }
        button.primary-btn:hover { background-color: var(--button-hover); border-color: #555; }
        
        button.secondary-btn { 
            background-color: transparent; 
            color: var(--text-muted); 
            border: 1px solid var(--border-color); 
            padding: 11px 0; 
            font-size: 12px; 
            font-weight: 500; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: 0.2s; 
            text-transform: lowercase; 
            width: 100%; 
        }
        button.secondary-btn:hover { color: var(--text-main); border-color: #555; }

        /* Слоты закрепленных комнат */
        #pinned-rooms-section {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            text-align: left;
        }
        .pinned-rooms-title {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pinned-list { display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; }
        .pinned-room-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            text-align: left;
        }
        .pinned-room-btn:hover {
            border-color: #444;
            background: var(--button-hover);
        }
        .pinned-room-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-main); }
        .pinned-room-del { color: var(--text-muted); padding: 2px 6px; font-size: 14px; }
        .pinned-room-del:hover { color: var(--danger); }

        /* Карточка пользователя */
        .user-card { 
            background-color: transparent; 
            width: 140px; 
            height: 150px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            border: none; 
            animation: popIn 0.25s ease; 
            position: relative; 
        }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        
        .avatar { 
            width: 58px; 
            height: 58px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px; 
            font-weight: 700; 
            background-color: var(--button-bg); 
            margin-bottom: 8px; 
            text-transform: lowercase; 
            overflow: hidden; 
            border: 2px solid var(--border-color); 
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease; 
        }
        .avatar.speaking { 
            transform: scale(1.06); 
            box-shadow: 0 0 0 3px var(--success); 
            border-color: var(--success) !important; 
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .user-name { 
            font-size: 13px; 
            font-weight: 500; 
            text-transform: lowercase; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 4px; 
            max-width: 130px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .nick-text { overflow: hidden; text-overflow: ellipsis; }

        /* Индикатор устройства и качества связи */
        .user-status { 
            font-size: 11px; 
            color: var(--text-muted); 
            margin-top: 3px; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            text-transform: lowercase; 
            height: 16px; 
        }
        
        .status-device-indicator {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 13px;
            height: 13px;
            color: var(--success);
        }
        .status-device-indicator svg {
            width: 12px;
            height: 12px;
            display: block;
        }

        /* МИНИМАЛИСТИЧНЫЙ ИНДИКАТОР КАЧЕСТВА СВЯЗИ (3 вертикальные полоски: 3px, 6px, 9px) */
        .net-quality {
            display: inline-flex;
            align-items: flex-end;
            gap: 1.5px;
            height: 9px;
            margin-left: 1px;
            flex-shrink: 0;
        }
        .net-bar {
            width: 2px;
            background-color: #333333;
            border-radius: 1px;
            transition: background-color 0.25s ease;
        }
        .net-bar.b1 { height: 3px; }
        .net-bar.b2 { height: 6px; }
        .net-bar.b3 { height: 9px; }

        .net-quality.good .net-bar.b1,
        .net-quality.good .net-bar.b2,
        .net-quality.good .net-bar.b3 {
            background-color: var(--success);
        }
        .net-quality.medium .net-bar.b1,
        .net-quality.medium .net-bar.b2 {
            background-color: var(--warning);
        }
        .net-quality.bad .net-bar.b1 {
            background-color: var(--danger);
        }

        .status-icons { display: flex; gap: 4px; margin-left: 3px; }
        .status-icons svg { width: 13px; height: 13px; color: var(--danger); }
        
        .card-menu-btn { position: absolute; top: 4px; right: 4px; background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-muted); width: 24px; height: 24px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; z-index: 10; }
        .user-card:hover .card-menu-btn { opacity: 1; }
        .card-menu-btn:hover { color: var(--text-main); border-color: #555; }
        
        .card-dropdown { position: absolute; top: 32px; right: 4px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; display: none; flex-direction: column; gap: 8px; z-index: 20; box-shadow: 0 8px 24px rgba(0,0,0,0.8); min-width: 150px; text-align: left; }
        .card-dropdown.open { display: flex; }
        
        .local-controls { display: flex; align-items: center; gap: 8px; width: 100%; }
        .admin-controls { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border-color); padding-top: 8px; }
        .admin-btn { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); padding: 5px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: 0.2s; text-transform: lowercase; text-align: left; }
        .admin-btn:hover { color: var(--text-main); border-color: #555; background: rgba(255,255,255,0.05); }
        .admin-btn.danger:hover { color: var(--danger); border-color: var(--danger); }
        
        .loc-mute-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
        .loc-mute-btn:hover { color: var(--text-main); }
        .loc-mute-btn.muted { color: var(--danger); }
        .loc-mute-btn svg { width: 16px; height: 16px; }
        
        .loc-vol { -webkit-appearance: none; flex: 1; height: 4px; background: var(--border-color); border-radius: 2px; outline: none; cursor: pointer; }
        .loc-vol::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); }
        
        /* Нижняя панель */
        #controls-panel { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; padding: 6px 8px; gap: 8px; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.6); align-items: center; }
        .icon-btn { width: 40px; height: 40px; border-radius: 6px; background-color: var(--button-bg); border: none; color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; position: relative; }
        .icon-btn:hover { background-color: var(--button-hover); }
        .icon-btn svg { width: 20px; height: 20px; stroke-width: 2; }
        .icon-btn.off { color: var(--danger); background-color: rgba(255, 85, 85, 0.1); }
        .icon-btn.off::after { content: ''; position: absolute; width: 2px; height: 24px; background-color: var(--danger); transform: rotate(45deg); border-radius: 2px; box-shadow: 0 0 0 2px var(--bg-secondary); }
        
        .icon-group { display: flex; background-color: var(--button-bg); border-radius: 6px; overflow: hidden; }
        .icon-group .icon-btn { border-radius: 0; background-color: transparent; }
        .icon-group .icon-btn:hover { background-color: rgba(255,255,255,0.05); }
        .icon-group .icon-btn.off { background-color: rgba(255, 85, 85, 0.1); }
        
        .leave-btn { background-color: var(--danger); color: var(--text-main); }
        .leave-btn:hover { background-color: #ff3333; }
        
        .hotkey-btn { background-color: transparent; color: var(--text-muted); border: none; border-left: 1px solid var(--border-color); padding: 0 8px; font-size: 11px; font-weight: 500; cursor: pointer; transition: color 0.2s; min-width: 32px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
        .hotkey-btn:hover { color: var(--text-main); }
        .hotkey-btn.listening { color: var(--success); }
        .hotkey-btn svg { width: 14px; height: 14px; stroke-width: 2; }
        .cancel-hk { width: 12px; height: 12px; margin-left: 4px; color: var(--text-muted); display: inline-block; }
        .cancel-hk:hover { color: var(--danger); }
        
        #chat-badge { position: absolute; top: -2px; right: -2px; width: 9px; height: 9px; background-color: var(--danger); border-radius: 50%; display: none; box-shadow: 0 0 0 2px var(--bg-secondary); }

        /* QR Код модалка и Модалка списка банов */
        #qr-modal, #banlist-modal { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 500; }
        .qr-card, .banlist-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; box-shadow: 0 16px 40px rgba(0,0,0,0.8); position: relative; max-width: 310px; width: 90vw; }
        .qr-close-btn { position: absolute; top: 8px; right: 10px; background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; line-height: 1; }
        .qr-close-btn:hover { color: var(--text-main); }
        .qr-box { background: #ffffff; padding: 10px; border-radius: 8px; display: flex; justify-content: center; align-items: center; }
        .qr-room-text { font-size: 13px; color: var(--text-muted); text-transform: lowercase; }

        /* Список забаненных внутри #banlist-modal */
        .banlist-items {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }
        .banlist-empty {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            padding: 14px 0;
            text-transform: lowercase;
        }
        .banlist-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--button-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 10px;
            gap: 8px;
        }
        .banlist-nick {
            font-size: 12px;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-transform: lowercase;
        }
        .unban-btn {
            background: transparent;
            border: 1px solid rgba(80, 250, 123, 0.35);
            color: var(--success);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: lowercase;
            flex-shrink: 0;
        }
        .unban-btn:hover {
            background: rgba(80, 250, 123, 0.12);
            border-color: var(--success);
        }

        /* Модалка профиля */
        #profile-modal { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; z-index: 300; }
        .modal-content { background: var(--bg); border: 1px solid var(--border-color); padding: 24px; border-radius: 8px; width: 290px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
        .avatar-upload { width: 72px; height: 72px; border-radius: 50%; background-color: var(--bg-secondary); border: 1px dashed #444; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; }
        .avatar-upload img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-upload span { font-size: 11px; color: var(--text-muted); position: absolute; }
        #avatarInput { display: none; }
        #removeAvatarBtn { color: var(--danger); font-size: 11px; cursor: pointer; margin-top: -6px; display: none; }
        #removeAvatarBtn:hover { text-decoration: underline; }
        input[type="color"] { -webkit-appearance: none; border: 1px solid var(--border-color); width: 100%; height: 36px; border-radius: 4px; cursor: pointer; padding: 0; background-color: var(--bg-secondary); }
        #resetProfileBtn { color: var(--text-muted); font-size: 11px; cursor: pointer; text-decoration: underline; margin-top: -4px; }
        #resetProfileBtn:hover { color: var(--danger); }
        .modal-buttons { display: flex; gap: 8px; width: 100%; }

        /* Чат */
        #chat-panel { position: absolute; inset: 0; z-index: 1000; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s; display: flex; justify-content: center; align-items: center; padding: 16px; padding-bottom: 85px; }
        #chat-panel.open { opacity: 1; visibility: visible; }
        .chat-inner { width: 100%; max-width: 660px; height: 100%; max-height: 80vh; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.8); }
        .chat-header { padding: 14px 18px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; font-weight: 500; background: #161616; font-size: 14px; }
        #close-chat { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; line-height: 1; }
        #close-chat:hover { color: var(--danger); }
        #chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { font-size: 13px; line-height: 1.4; word-wrap: break-word; }
        .chat-img { max-width: 100%; border-radius: 4px; margin-top: 4px; display: block; border: 1px solid #333; }
        .chat-file { display: inline-block; background: var(--button-bg); padding: 5px 8px; border-radius: 4px; color: var(--text-main); text-decoration: none; margin-top: 4px; font-size: 11px; border: 1px solid #333; }
        .chat-input-area { padding: 10px 16px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; align-items: center; }
        .chat-input-area input[type="text"] { flex: 1; padding: 10px; font-size: 13px; text-align: left; }
        #chat-attach-btn { cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; padding: 4px; }
        #chat-attach-btn svg { width: 18px; height: 18px; }
        #chat-send { background: var(--button-bg); border: 1px solid var(--border-color); color: var(--text-main); width: 38px; height: 38px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #chat-send svg { width: 16px; height: 16px; }
        
        #banned-screen { position: absolute; inset: 0; background: var(--bg); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; text-align: center; padding: 20px; gap: 10px; }
        .banned-actions { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 240px; }
        #admin-notifications { position: absolute; top: 70px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 2000; }
        .appeal-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); width: 260px; text-align: left; }
        
        #toast-notification {
            position: fixed;

                if (quality) peerHealth[peerId].quality = quality;
