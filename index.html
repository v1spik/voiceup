        profileBtn.onclick = openProfile;
        
        avatarInput.onchange = (e) => { 
            const file = e.target.files[0]; if (!file) return; 
            const reader = new FileReader(); 
            reader.onload = (event) => { 
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas'); const MAX_SIZE = 150; 
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                    else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                    canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    avatarPreview.src = canvas.toDataURL('image/jpeg', 0.8); avatarPreview.style.display = 'block'; avatarUploadText.style.display = 'none'; removeAvatarBtn.style.display = 'block'; 
                }; img.src = event.target.result;
            }; reader.readAsDataURL(file); 
        };

        removeAvatarBtn.onclick = () => { 
            avatarPreview.src = ""; 
            avatarPreview.style.display = 'none'; 
            avatarUploadText.style.display = 'block'; 
            removeAvatarBtn.style.display = 'none'; 
            avatarInput.value = ""; 
        };
        cancelProfileBtn.onclick = () => { profileModal.style.display = 'none'; avatarInput.value = ""; };
        
        resetProfileBtn.onclick = () => {
            myProfile.color = "#ffffff"; 
            myProfile.avatar = ""; 
            colorInput.value = "#ffffff"; 
            avatarPreview.src = ""; 
            avatarPreview.style.display = 'none'; 
            avatarUploadText.style.display = 'block'; 
            removeAvatarBtn.style.display = 'none'; 
            avatarInput.value = ""; 
            saveMyProfileToStorage();
            profileBtn.innerHTML = `👤`; 
            updateCardVisuals(myId, myProfile, true); 
            broadcastSignaling({ type: 'update-profile', id: myId, profile: myProfile });
            profileModal.style.display = 'none';
        };

        saveProfileBtn.onclick = () => {
            myProfile.color = colorInput.value; 
            myProfile.avatar = (avatarPreview.style.display === 'block') ? avatarPreview.src : "";
            saveMyProfileToStorage();
            profileModal.style.display = 'none';
            profileBtn.innerHTML = myProfile.avatar ? `<img src="${myProfile.avatar}">` : `👤`; 
            updateCardVisuals(myId, myProfile, true); 
            broadcastSignaling({ type: 'update-profile', id: myId, profile: myProfile });
        };

        window.changeLocalVolume = (id, vol) => { 
            if (!localPeerSettings[id]) localPeerSettings[id] = { volume: 1, muted: false }; 
            localPeerSettings[id].volume = parseFloat(vol); 
            const audio = document.getElementById(`audio-${id}`);
            if (audio && !localPeerSettings[id].muted) audio.volume = parseFloat(vol);
        };
        
        window.toggleLocalMute = (id) => { 
            if (!localPeerSettings[id]) localPeerSettings[id] = { volume: 1, muted: false }; 
            localPeerSettings[id].muted = !localPeerSettings[id].muted; 
            const audio = document.getElementById(`audio-${id}`);
            if (audio) audio.volume = localPeerSettings[id].muted ? 0 : localPeerSettings[id].volume;
            updateCardVisuals(id, userProfiles[id], false); 
        };

        window.sendAdminAction = (action, targetId) => {
            if (!isRoomHost) return; 
            const targetDeviceId = userProfiles[targetId]?.deviceId || 'unknown';
            if (action === 'kick') { 
                bannedDevices[targetDeviceId] = true; 
                localStorage.setItem('voiceup_banned_devices', JSON.stringify(bannedDevices)); 
                cleanupPeer(targetId); 
                playUiSound('leave'); 
            }
            broadcastSignaling({ type: `admin_${action}`, target: targetId, senderName: myProfile.nick });
            toggleCardMenu(targetId); 
        };
        
        window.toggleAdminMute = (targetId) => { 
            const isServerMuted = userStates[targetId] && userStates[targetId].adminMuted; 
            sendAdminAction(isServerMuted ? 'unmute' : 'mute', targetId); 
        };

        function broadcastStatus() { 
            const actualMic = micEnabled && !adminMuted; 
            userStates[myId] = { mic: actualMic, deaf: !soundEnabled, adminMuted: adminMuted }; 
            updateCardVisuals(myId, myProfile, true); 
            broadcastSignaling({ type: 'status', id: myId, state: userStates[myId] });
        }
        
        function updateMicHardware() { 
            if (!localStream) return; 
            const actualMic = micEnabled && !adminMuted; 
            const audioTracks = localStream.getAudioTracks();
            if (audioTracks && audioTracks.length > 0) {
                audioTracks[0].enabled = actualMic;
            }
            micBtn.classList.toggle('off', !actualMic); 
            broadcastStatus(); 
        }
        
        function toggleMic() { 
            if (!localStream) return; 
            if (adminMuted) { alert(dict[currentLang].adminMutedAlert); return; } 
            micEnabled = !micEnabled; 
            playUiSound(micEnabled ? 'mic_on' : 'mic_off'); 
            updateMicHardware(); 
        }
        
        function toggleDeafen() { 
            soundEnabled = !soundEnabled; 
            document.querySelectorAll('#webrtc-audio-container audio').forEach(a => a.muted = !soundEnabled);
            deafenBtn.classList.toggle('off', !soundEnabled); 
            playUiSound(soundEnabled ? 'deafen_off' : 'deafen_on'); 
            broadcastStatus(); 
        }

        micBtn.onclick = toggleMic; 
        deafenBtn.onclick = toggleDeafen;
        
        micHotkeyBtn.onclick = () => { 
            if (isAssigningMicHotkey) { isAssigningMicHotkey = false; micHotkeyBtn.classList.remove('listening'); updateHotkeysUI(); return; } 
            isAssigningMicHotkey = true; isAssigningDeafenHotkey = false; micHotkeyBtn.classList.add('listening'); deafenHotkeyBtn.classList.remove('listening'); updateHotkeysUI(); 
        };
        deafenHotkeyBtn.onclick = () => { 
            if (isAssigningDeafenHotkey) { isAssigningDeafenHotkey = false; deafenHotkeyBtn.classList.remove('listening'); updateHotkeysUI(); return; } 
            isAssigningDeafenHotkey = true; isAssigningMicHotkey = false; deafenHotkeyBtn.classList.add('listening'); micHotkeyBtn.classList.remove('listening'); updateHotkeysUI(); 
        };

        function leaveRoom() { 
            if (heartbeatTimer) clearInterval(heartbeatTimer);
            if (meshScanTimer) clearInterval(meshScanTimer);
            stopSessionTimer();
            broadcastSignaling({ type: 'leave', id: myId });
            if (localStream) localStream.getTracks().forEach(track => track.stop()); 
            if (peer) { try { peer.destroy(); } catch (e) {} }
            document.getElementById('room-screen').innerHTML = ''; 
            window.location.href = window.location.pathname; 
        }
        
        disconnectBtn.onclick = leaveRoom; 
        window.addEventListener('beforeunload', () => { 
            broadcastSignaling({ type: 'leave', id: myId });
            if (peer) { try { peer.destroy(); } catch (e) {} }
        });
        
        window.addEventListener('keydown', (e) => { 
            if (isAssigningMicHotkey) { micHotkey = formatKey(e.key); if (micHotkey) localStorage.setItem('voiceup_hotkey', micHotkey); isAssigningMicHotkey = false; micHotkeyBtn.classList.remove('listening'); updateHotkeysUI(); e.preventDefault(); return; } 
            if (isAssigningDeafenHotkey) { deafenHotkey = formatKey(e.key); if (deafenHotkey) localStorage.setItem('voiceup_deafen_hotkey', deafenHotkey); isAssigningDeafenHotkey = false; deafenHotkeyBtn.classList.remove('listening'); updateHotkeysUI(); e.preventDefault(); return; } 
            if (document.activeElement.tagName === 'INPUT') return; 
            const pressedKey = formatKey(e.key); 
            if (micHotkey && pressedKey === micHotkey) { toggleMic(); e.preventDefault(); } 
            if (deafenHotkey && pressedKey === deafenHotkey) { toggleDeafen(); e.preventDefault(); } 
        });
        
        chatBtn.onclick = () => { chatOpen = true; chatPanel.classList.add('open'); chatBadge.style.display = 'none'; chatInput.focus(); };
        closeChatBtn.onclick = () => { chatOpen = false; chatPanel.classList.remove('open'); };
        chatPanel.onclick = (e) => { if (e.target === chatPanel) closeChatBtn.onclick(); };

        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
        
        function appendChatMessage(id, msgObj) {
            const msgDiv = document.createElement('div'); msgDiv.className = 'chat-msg'; 
            const profile = id === myId ? myProfile : (userProfiles[id] || {nick: dict[currentLang].guest, color: '#ffffff'}); 
            let contentHtml = '';
            if (msgObj.type === 'text') { contentHtml = `<span>${escapeHTML(msgObj.text)}</span>`; } 
            else if (msgObj.type === 'file') { 
                if (msgObj.mime.startsWith('image/')) contentHtml = `<img src="${msgObj.data}" class="chat-img" alt="${escapeHTML(msgObj.name)}">`; 
                else contentHtml = `<a href="${msgObj.data}" download="${escapeHTML(msgObj.name)}" class="chat-file">📎 ${escapeHTML(msgObj.name)}</a>`; 
            }
            msgDiv.innerHTML = `<b style="color:${profile.color}">${escapeHTML(profile.nick)}</b>: ${contentHtml}`; 
            document.getElementById('chat-messages').appendChild(msgDiv); 
            document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
        }
        
        function handleIncomingMessage(peerId, msgObj) { 
            appendChatMessage(peerId, msgObj); 
            if (!chatOpen) chatBadge.style.display = 'block'; 
            playUiSound('chat_msg'); 
        }

        chatSend.onclick = () => { 
            const text = chatInput.value.trim(); if (!text) return; 
            chatInput.value = ''; const msgObj = { type: 'text', text: text }; 
            broadcastSignaling({ type: 'chat', id: myId, data: msgObj });
            appendChatMessage(myId, msgObj); 
        }; 
        chatInput.onkeydown = (e) => { if (e.key === 'Enter') chatSend.onclick(); };
        
        chatFileInput.onchange = (e) => { 
            const file = e.target.files[0]; if (!file) return; 
            if (file.size > 5 * 1024 * 1024) { alert(dict[currentLang].fileTooBig); e.target.value = ''; return; } 
            const reader = new FileReader(); 
            reader.onload = (event) => { 
                const msgObj = { type: 'file', name: file.name, mime: file.type, data: event.target.result }; 
                broadcastSignaling({ type: 'chat', id: myId, data: msgObj });
                appendChatMessage(myId, msgObj); 
            }; 
            reader.readAsDataURL(file); e.target.value = ''; 
        };

        function getColor(id) { 
            let hash = 0; 
            for (let i = 0; i < id.length; i++) hash = id.charCodeAt(i) + ((hash << 5) - hash); 
            return `hsl(0, 0%, ${30 + (Math.abs(hash) % 30)}%)`; 
        }

        window.toggleCardMenu = function(id) { 
            document.querySelectorAll('.card-dropdown').forEach(menu => { 
                if (menu.id !== `menu-${id}`) menu.classList.remove('open'); 
            }); 
            const menu = document.getElementById(`menu-${id}`); 
            if (menu) menu.classList.toggle('open'); 
        };

        document.addEventListener('click', (e) => { 
            if (!e.target.closest('.user-card')) { 
                document.querySelectorAll('.card-dropdown').forEach(menu => menu.classList.remove('open')); 
            } 
        });

        function addUserCard(id, profile, isMe) {
            // Защита от дублирования карточек одного и того же физического устройства при переподключении
            Object.keys(userProfiles).forEach(existingId => {
                if (existingId !== id && existingId !== myId && userProfiles[existingId]?.deviceId && userProfiles[existingId]?.deviceId === profile.deviceId) {
                    cleanupPeer(existingId);
                }
            });

            const isNew = !document.getElementById(`card-${id}`); 
            userProfiles[id] = profile; 
            if(!userStates[id]) userStates[id] = { mic: true, deaf: false, adminMuted: false }; 
            if(!localPeerSettings[id]) localPeerSettings[id] = { volume: 1, muted: false };
            if(!peerHealth[id]) peerHealth[id] = { lastSeen: Date.now(), rtt: 30, quality: 'good', reconnecting: false };
            
            updateCardVisuals(id, profile, isMe); 
            if (isNew && !isMe) setTimeout(() => playUiSound('join'), 400);
        }

        function updateCardVisuals(id, profile, isMe) {
            let card = document.getElementById(`card-${id}`); 
            const state = userStates[id] || { mic: true, deaf: false, adminMuted: false }; 
            
            if(!card) {
                card = document.createElement('div'); 
                card.className = 'user-card'; 
                card.id = `card-${id}`;
                card.innerHTML = `
                    <div class="avatar"></div>
                    <div class="user-name">
                        <span class="nick-text"></span>
                        <span class="is-me-badge"></span>
                    </div>
                    <div class="user-status">
                        <span class="device-dot-container"></span>
                        <span class="net-quality-container"></span>
                        <span class="status-text"></span>
                        <div class="status-icons"></div>
                    </div>
                    ${!isMe ? `
                    <button class="card-menu-btn" onclick="toggleCardMenu('${id}')" title="Настройки">
                        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle>
                        </svg>
                    </button>
                    <div class="card-dropdown" id="menu-${id}">
                        <div class="trans-local-sound" style="font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">${dict[currentLang].localSound}</div>
                        <div class="local-controls">
                            <button class="loc-mute-btn" title="Локальный мут"></button>
                            <input type="range" class="loc-vol" min="0" max="1" step="0.05" title="Громкость">
                        </div>
                        <div class="admin-controls" style="display:none;">
                            <div class="trans-admin-panel" style="font-size: 11px; color: var(--danger); margin-bottom: 4px;">${dict[currentLang].adminPanel}</div>
                            <button class="admin-btn admin-mute-btn" onclick="toggleAdminMute('${id}')">${state.adminMuted ? dict[currentLang].unmuteMic : dict[currentLang].muteMic}</button>
                            <button class="admin-btn danger trans-kick" onclick="sendAdminAction('kick', '${id}')">${dict[currentLang].kick}</button>
                        </div>
                    </div>` : ''}`;
                roomScreen.appendChild(card); 
                
                if (!isMe) { 
                    card.querySelector('.loc-vol').oninput = (e) => changeLocalVolume(id, e.target.value); 
                    card.querySelector('.loc-mute-btn').onclick = () => toggleLocalMute(id); 
                }
            }
            
            const locSet = localPeerSettings[id] || { volume: 1, muted: false }; 
            const nick = profile.nick || dict[currentLang].guest; 
            const color = profile.color || '#ffffff'; 
            const bgColor = getColor(id); 
            const initial = nick.substring(0, 2); 
            const avatarHtml = profile.avatar ? `<img src="${profile.avatar}">` : initial;
            
            card.querySelector('.avatar').style.backgroundColor = bgColor; 
            card.querySelector('.avatar').innerHTML = avatarHtml; 
            card.querySelector('.nick-text').innerText = nick; 
            card.querySelector('.user-name').style.color = color;
            
            const deviceType = profile.deviceType || 'pc';
            card.querySelector('.device-dot-container').innerHTML = getStatusDotHtml(deviceType);
            card.querySelector('.net-quality-container').innerHTML = getNetQualityHtml(id);

            // Щит админа строго у ЕДИНСТВЕННОГО создателя комнаты (id === currentHostId)
            const isThisPeerHost = Boolean(currentHostId && id === currentHostId);
            const adminBadge = isThisPeerHost ? svgAdmin : ''; 
            card.querySelector('.is-me-badge').innerHTML = (isMe ? dict[currentLang].you : '') + (adminBadge ? ' ' + adminBadge : ''); 
            card.querySelector('.status-text').innerText = dict[currentLang].online;
            
            let iconsHtml = ''; 
            if (!state.mic) iconsHtml += badgeMicOff; 
            if (state.deaf) iconsHtml += badgeDeafOff; 
            card.querySelector('.status-icons').innerHTML = iconsHtml;
            
            if (!isMe) {
                card.querySelector('.loc-vol').value = locSet.volume; 
                card.querySelector('.loc-mute-btn').innerHTML = locSet.muted ? svgLocMute : svgLocUnmute; 
                card.querySelector('.loc-mute-btn').className = `loc-mute-btn ${locSet.muted ? 'muted' : ''}`;
                
                const adminControls = card.querySelector('.admin-controls');
                if (isRoomHost) {
                    adminControls.style.display = 'flex'; 
                    const adminMuteBtn = card.querySelector('.admin-mute-btn'); 
                    if (adminMuteBtn) adminMuteBtn.innerText = state.adminMuted ? dict[currentLang].unmuteMic : dict[currentLang].muteMic; 
                } else {
                    adminControls.style.display = 'none';
                }
            }
        }

        function removeUserCard(id) { 
            const card = document.getElementById(`card-${id}`); 
            if(card) card.remove(); 
        }

        function showBannedScreen() { 
            stopSessionTimer();
            if (localStream) localStream.getTracks().forEach(t => t.stop()); 
            joinScreen.style.display = 'none'; 
            roomScreen.style.display = 'none'; 
            controlsPanel.style.display = 'none'; 
            roomHeader.style.display = 'none';
            chatPanel.classList.remove('open'); 
            bannedScreen.style.display = 'flex'; 
        }

        document.getElementById('appealBtn').onclick = () => {
            const nick = elInput.value.trim() || myProfile.nick || dict[currentLang].guest; 
            broadcastSignaling({ type: 'ban_appeal', id: myId, nick: nick, deviceId: myProfile.deviceId });
            document.getElementById('appealBtn').innerText = dict[currentLang].reqSent; 
            document.getElementById('appealBtn').disabled = true; 
            document.getElementById('appealBtn').style.opacity = '0.5';
        };

        window.acceptAppeal = (targetId, deviceId) => {
            delete bannedDevices[deviceId]; 
            localStorage.setItem('voiceup_banned_devices', JSON.stringify(bannedDevices));
            const notif = document.getElementById(`appeal-${deviceId}`); 
            if (notif) notif.remove(); 
            broadcastSignaling({ type: 'appeal_accepted', target: targetId });
        };
        
        window.ignoreAppeal = (deviceId) => { 
            ignoredAppeals[deviceId] = true; 
            localStorage.setItem('voiceup_ignored_appeals', JSON.stringify(ignoredAppeals)); 
            const notif = document.getElementById(`appeal-${deviceId}`); 
            if (notif) notif.remove(); 
        };

        // ВХОД В КОМНАТУ
        elBtn.onclick = async () => {
            if (localStorage.getItem('voiceup_banned') === 'true') { 
                return showBannedScreen(); 
            }
            const inputVal = elInput.value.trim(); 
            if (!inputVal) return alert(dict[currentLang].needNick);
            
            myProfile.nick = inputVal; 
            myProfile.isAdmin = false;
            saveMyProfileToStorage();

            let customRoom = roomCodeInput.value.trim();
            if (customRoom) {
                activeRoom = sanitizeRoomName(customRoom);
            }
            if (!activeRoom) {
                activeRoom = generateUniqueRoomId();
            }
            roomCodeInput.value = activeRoom;
            window.history.replaceState(null, '', window.location.pathname + '?room=' + activeRoom);
            
            try {
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume(); 
                }
                
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: { ideal: true },
                        noiseSuppression: { ideal: true },
                        autoGainControl: { ideal: false },
                        latency: { ideal: 0.05 },
                        googEchoCancellation: { ideal: true },
                        googNoiseSuppression: { ideal: true },
                        googAutoGainControl: { ideal: false },
                        googHighpassFilter: { ideal: true }
                    }, 
                    video: false 
                });
                
                joinScreen.style.opacity = '0';
                setTimeout(() => { 
                    joinScreen.style.display = 'none'; 
                    roomScreen.style.opacity = '1'; 
                    profileBtn.style.display = 'flex'; 
                    roomHeader.style.display = 'flex';
                    controlsPanel.style.display = 'flex'; 
                    updateHotkeysUI(); 
                    if(myProfile.avatar) profileBtn.innerHTML = `<img src="${myProfile.avatar}">`; 
                }, 300);
                
                startPeerConnection();
            } catch (err) { 
                console.error("Audio access error:", err);
                alert(dict[currentLang].needMic + "\n" + (err.message || '')); 
            }
        };

        setLanguage('ru');
    </script>
</body>
</html>
