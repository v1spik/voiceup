<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>voiceup</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #000000; --bg-secondary: #111111; --text-main: #ffffff; --text-muted: #aaaaaa; --button-bg: #222222; --button-hover: #333333; --success: #50fa7b; --danger: #ff5555; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; font-weight: 400; }
        body { background-color: var(--bg); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        .app-name { position: absolute; top: 30px; font-size: 18px; font-weight: 700; letter-spacing: 2px; text-transform: lowercase; color: var(--text-muted); }
        #profile-btn { position: absolute; top: 25px; left: 30px; width: 36px; height: 36px; border-radius: 50%; background-color: var(--button-bg); border: 1px solid #333; color: var(--text-muted); display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 200; transition: 0.2s; overflow: hidden; }
        #profile-btn:hover { border-color: #666; color: var(--text-main); }
        #profile-btn img { width: 100%; height: 100%; object-fit: cover; }
        .lang-switch { position: absolute; top: 30px; right: 30px; font-size: 14px; color: var(--text-muted); z-index: 200; user-select: none; }
        .lang-switch span { cursor: pointer; transition: color 0.2s; }
        .lang-switch span.active { color: var(--text-main); font-weight: 500; }
        #room-screen { flex: 1; padding: 20px; padding-bottom: 160px; display: flex; flex-wrap: wrap; align-content: center; align-items: center; gap: 20px; justify-content: center; opacity: 0; transition: opacity 0.5s ease; overflow-y: auto; height: 100%; }
        #join-screen { position: absolute; background: var(--bg); padding: 40px; text-align: center; z-index: 100; display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 400px; }
        h1 { font-size: 28px; font-weight: 500; text-transform: lowercase; }
        input[type="text"] { background-color: var(--bg-secondary); color: var(--text-main); border: 1px solid #333; padding: 16px; font-size: 16px; border-radius: 4px; width: 100%; outline: none; text-align: center; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #666; }
        button.primary-btn { background-color: var(--button-bg); color: var(--text-main); border: none; padding: 16px 0; font-size: 16px; font-weight: 500; border-radius: 4px; cursor: pointer; transition: 0.2s; text-transform: lowercase; width: 100%; }
        button.primary-btn:hover { background-color: var(--button-hover); }
        button.secondary-btn { background-color: transparent; color: var(--text-muted); border: 1px solid #333; padding: 16px 0; font-size: 16px; font-weight: 500; border-radius: 4px; cursor: pointer; transition: 0.2s; text-transform: lowercase; width: 100%; }
        button.secondary-btn:hover { color: var(--text-main); border-color: #666; }
        #profile-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 300; }
        .modal-content { background: var(--bg); border: 1px solid #333; padding: 30px; border-radius: 4px; width: 300px; display: flex; flex-direction: column; align-items: center; gap: 20px; }

        .avatar-upload:hover { border-color: #888; }
        .avatar-upload img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-upload span { font-size: 12px; color: var(--text-muted); position: absolute; }
        #avatarInput { display: none; }
        #removeAvatarBtn { color: var(--danger); font-size: 12px; cursor: pointer; margin-top: -10px; display: none; transition: 0.2s;}
        #removeAvatarBtn:hover { text-decoration: underline; }
        input[type="color"] { -webkit-appearance: none; border: 1px solid #333; width: 100%; height: 40px; border-radius: 4px; cursor: pointer; padding: 0; background-color: var(--bg-secondary); }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 2px; }
        #resetProfileBtn { color: var(--text-muted); font-size: 12px; cursor: pointer; text-decoration: underline; transition: 0.2s; margin-top: -5px; }
        #resetProfileBtn:hover { color: var(--danger); }
        .modal-buttons { display: flex; gap: 10px; width: 100%; }
        .user-card { background-color: transparent; width: 160px; height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: none; box-shadow: none; animation: popIn 0.4s ease; position: relative; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        .avatar { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; background-color: var(--button-bg); margin-bottom: 15px; text-transform: lowercase; overflow: hidden; border: 1px solid #333; transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .avatar.speaking { transform: scale(1.08); box-shadow: 0 0 0 3px var(--success); border-color: var(--success); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-name { font-size: 14px; font-weight: 500; text-transform: lowercase; display: flex; align-items: center; gap: 4px; }
        .user-status { font-size: 12px; color: var(--text-muted); margin-top: 5px; display: flex; align-items: center; gap: 6px; text-transform: lowercase; height: 16px; }
        .user-status::before { content: ''; display: block; width: 6px; height: 6px; background-color: var(--success); border-radius: 50%; transition: 0.3s; }
        .status-icons { display: flex; gap: 4px; margin-left: 4px; }
        .status-icons svg { width: 14px; height: 14px; color: var(--danger); }
        .card-menu-btn { position: absolute; top: 10px; right: 10px; background: var(--bg-secondary); border: 1px solid #333; color: var(--text-muted); width: 28px; height: 28px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; z-index: 10; }
        .user-card:hover .card-menu-btn { opacity: 1; }
        .card-menu-btn:hover { color: var(--text-main); border-color: #666; }
        .card-dropdown { position: absolute; top: 45px; right: 10px; background: var(--bg-secondary); border: 1px solid #333; border-radius: 6px; padding: 12px; display: none; flex-direction: column; gap: 12px; z-index: 20; box-shadow: 0 8px 16px rgba(0,0,0,0.8); min-width: 150px; text-align: left; animation: fadeIn 0.15s ease-out; }
        .card-dropdown.open { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .local-controls { display: flex; align-items: center; gap: 8px; width: 100%; opacity: 1; margin: 0; padding: 0; }
        .admin-controls { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #333; padding-top: 12px; }
        .admin-btn { background: transparent; color: var(--text-muted); border: 1px solid #333; padding: 6px; border-radius: 4px; font-size: 12px; cursor: pointer; transition: 0.2s; text-transform: lowercase; text-align: left; }
        .admin-btn:hover { color: var(--text-main); border-color: #666; background: rgba(255,255,255,0.05); }
        .admin-btn.danger:hover { color: var(--danger); border-color: var(--danger); background: rgba(255,85,85,0.1); }
        .loc-mute-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        .loc-mute-btn:hover { color: var(--text-main); }
        .loc-mute-btn.muted { color: var(--danger); }
        .loc-mute-btn svg { width: 18px; height: 18px; }
        .loc-vol { -webkit-appearance: none; flex: 1; height: 4px; background: #333; border-radius: 2px; outline: none; cursor: pointer; }
        .loc-vol::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--text-muted); transition: 0.2s; }
        .loc-vol::-webkit-slider-thumb:hover { background: var(--text-main); transform: scale(1.2); }
        #invite-link-box { position: absolute; bottom: 105px; left: 50%; transform: translateX(-50%); background-color: var(--text-main); color: var(--bg); font-size: 12px; font-weight: 500; padding: 8px 20px; border-radius: 4px; cursor: pointer; display: none; transition: background-color 0.2s, transform 0.2s; z-index: 50; box-shadow: 0 4px 12px rgba(255,255,255,0.1); text-transform: lowercase; }
        #invite-link-box:hover { background-color: #e0e0e0; transform: translateX(-50%) translateY(-2px); }
        #controls-panel { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: none; background-color: var(--bg-secondary); border: 1px solid #333; border-radius: 8px; padding: 8px; gap: 12px; z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.6); align-items: center; }
        .icon-btn { width: 44px; height: 44px; border-radius: 6px; background-color: var(--button-bg); border: none; color: var(--text-main); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; position: relative; }
        .icon-btn:hover { background-color: var(--button-hover); }
        .icon-btn svg { width: 22px; height: 22px; stroke-width: 2; }
        .icon-btn.off { color: var(--danger); background-color: rgba(255, 85, 85, 0.1); }
        .icon-btn.off::after { content: ''; position: absolute; width: 2px; height: 26px; background-color: var(--danger); transform: rotate(45deg); border-radius: 2px; box-shadow: 0 0 0 2px var(--bg-secondary); }
        .icon-group { display: flex; background-color: var(--button-bg); border-radius: 6px; overflow: hidden; }
        .icon-group .icon-btn { border-radius: 0; background-color: transparent; }
        .icon-group .icon-btn:hover { background-color: rgba(255,255,255,0.05); }
        .icon-group .icon-btn.off { background-color: rgba(255, 85, 85, 0.1); }
        .leave-btn { background-color: var(--danger); color: var(--text-main); }
        .leave-btn:hover { background-color: #ff3333; transform: scale(1.05); }
        .hotkey-btn { background-color: transparent; color: var(--text-muted); border: none; border-left: 1px solid #333; padding: 0 10px; font-size: 12px; font-weight: 500; cursor: pointer; transition: color 0.2s; min-width: 36px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
        .hotkey-btn:hover { color: var(--text-main); }
        .hotkey-btn.listening { color: var(--success); }
        .hotkey-btn svg { width: 16px; height: 16px; stroke-width: 2; }
        .cancel-hk { width: 14px; height: 14px; margin-left: 6px; color: var(--text-muted); transition: 0.2s; display: inline-block; }
        .cancel-hk:hover { color: var(--danger); }
        #chat-badge { position: absolute; top: -2px; right: -2px; width: 10px; height: 10px; background-color: var(--danger); border-radius: 50%; display: none; box-shadow: 0 0 0 2px var(--bg-secondary); }
        #chat-panel { position: absolute; inset: 0; z-index: 1000; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s; display: flex; justify-content: center; align-items: center; padding: 20px; padding-bottom: 100px; }
        #chat-panel.open { opacity: 1; visibility: visible; }
        .chat-inner { width: 100%; max-width: 700px; height: 100%; max-height: 80vh; background: var(--bg-secondary); border: 1px solid #333; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.8); transform-origin: bottom center; transform: scale(0.5) translateY(150px); transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1); }
        #chat-panel.open .chat-inner { transform: scale(1) translateY(0); }
        .chat-header { padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; font-weight: 500; background: #1a1a1a; }
        #close-chat { background: none; border: none; color: var(--text-muted); font-size: 28px; cursor: pointer; transition: 0.2s; line-height: 1; }
        #close-chat:hover { color: var(--danger); transform: scale(1.1); }
        #chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .chat-msg { font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .chat-img { max-width: 100%; border-radius: 4px; margin-top: 4px; display: block; border: 1px solid #333; }
        .chat-file { display: inline-block; background: var(--button-bg); padding: 8px 12px; border-radius: 4px; color: var(--text-main); text-decoration: none; margin-top: 4px; font-size: 12px; border: 1px solid #333; transition: 0.2s; }
        .chat-file:hover { background: var(--button-hover); border-color: #555; }
        .chat-input-area { padding: 15px 20px; border-top: 1px solid #333; display: flex; gap: 10px; align-items: center; }
        .chat-input-area input[type="text"] { flex: 1; padding: 12px; font-size: 14px; text-align: left; }
        #chat-attach-btn { cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; padding: 5px; transition: 0.2s;}
        #chat-attach-btn:hover { color: var(--text-main); }
        #chat-attach-btn svg { width: 20px; height: 20px; }
        #chat-send { background: var(--button-bg); border: 1px solid #333; color: var(--text-main); width: 44px; height: 44px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #chat-send:hover { background: var(--button-hover); }
        #chat-send svg { width: 18px; height: 18px; }
        #banned-screen { position: absolute; inset: 0; background: var(--bg); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; text-align: center; padding: 20px; }
        #admin-notifications { position: absolute; top: 80px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 2000; }
        .appeal-card { background: var(--bg-secondary); border: 1px solid #333; border-radius: 8px; padding: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.8); width: 280px; animation: slideIn 0.3s ease; text-align: left; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>
    <div class="app-name">voiceup</div>
    <div class="lang-switch"><span id="lang-ru" class="active">ru</span> / <span id="lang-en">en</span></div>
    <div id="profile-btn" title="настройки профиля">👤</div>

    <div id="profile-modal">
        <div class="modal-content">
            <label class="avatar-upload" id="avatarPreviewBox">
                <span id="avatarUploadText" class="trans-photo">фото</span>
                <img id="avatarPreview" style="display:none;" src="" alt="avatar">
                <input type="file" id="avatarInput" accept="image/png, image/jpeg, image/gif">
            </label>
            <div id="removeAvatarBtn" class="trans-remove-photo">удалить фото</div>
            <div style="width: 100%; text-align: center; font-size: 12px; color: #aaa;" class="trans-color">цвет ника</div>
            <input type="color" id="colorInput" value="#ffffff">
            <div id="resetProfileBtn" class="trans-reset">сбросить настройки</div>
            <div class="modal-buttons">
                <button id="cancelProfileBtn" class="secondary-btn trans-cancel">отмена</button>
                <button id="saveProfileBtn" class="primary-btn trans-save">сохранить</button>
            </div>
        </div>
    </div>

    <div id="room-screen"></div>

    <div id="join-screen">
        <h1 id="welcome-title">добро пожаловать в voiceup</h1>
        <input type="text" id="nicknameInput" placeholder="введите ваш никнейм" autocomplete="off" maxlength="15">
        <button id="startBtn" class="primary-btn">войти</button>
    </div>

    <div id="banned-screen">
        <h1 class="trans-banned-title" style="color: var(--danger); margin-bottom: 10px;">Доступ закрыт</h1>
        <p class="trans-banned-desc" style="color: var(--text-muted); margin-bottom: 25px;">Вы были кикнуты из комнаты. Запросите доступ у администратора.</p>
        <button id="appealBtn" class="primary-btn trans-req-access" style="max-width: 250px;">Запросить доступ</button>
    </div>

    <div id="admin-notifications"></div>
    <div id="invite-link-box" class="trans-invite">ссылка приглашения</div>

    <div id="controls-panel">
        <div class="icon-group">
            <button id="micBtn" class="icon-btn" title="Микрофон">
                <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>
            <button id="micHotkeyBtn" class="hotkey-btn" title="Хоткей микрофона"></button>
        </div>
        <div class="icon-group">

                <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
                    <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
                </svg>
            </button>
            <button id="deafenHotkeyBtn" class="hotkey-btn" title="Хоткей звука"></button>
        </div>
        <button id="chatBtn" class="icon-btn" title="Чат">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <div id="chat-badge"></div>
        </button>
        <button id="disconnectBtn" class="icon-btn leave-btn" title="Отключиться">
            <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 17l5-5-5-5M19.8 12H9M10 3H4v18h6"></path>
            </svg>
        </button>
    </div>

    <div id="chat-panel">
        <div class="chat-inner">
            <div class="chat-header">
                <span id="chat-title">чат</span>
                <button id="close-chat">×</button>
            </div>
            <div id="chat-messages"></div>
            <div class="chat-input-area">
                <label id="chat-attach-btn" title="Прикрепить файл">
                    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                    <input type="file" id="chat-file-input" style="display:none;">
                </label>
                <input type="text" id="chat-input" placeholder="сообщение..." autocomplete="off">
                <button id="chat-send">
                    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Контейнер для скрытых входящих аудио -->
    <div id="webrtc-audio-container" style="display:none;"></div>

    <!-- СКРИПТ ВНИЗУ, ЧТОБЫ ВСЕ КНОПКИ И ПОЛЯ БЫЛИ НАЙДЕНЫ -->
    <script>
        // 1. ОПРЕДЕЛЕНИЕ ХОСТА И КОМНАТЫ ПО ХЭШУ ССЫЛКИ
        let roomCode = window.location.hash.replace('#', '').trim();
        let isRoomHost = false;
        let hostPeerId = "";
        let myId = "";

        if (!roomCode) {
            isRoomHost = true;
            roomCode = 'vu' + Math.random().toString(36).substring(2, 8);
            hostPeerId = roomCode;
            myId = roomCode;
            window.location.hash = roomCode;
        } else {
            isRoomHost = false;
            hostPeerId = roomCode;
            myId = roomCode + '_' + Math.random().toString(36).substring(2, 8);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let peer = null;
        let localStream = null;
        const activeConnections = {};
        const activeCalls = {};
        let chatOpen = false;
        let isSpeaking = false;
        let speakTimeout;

        function handleIncomingSignal(remoteId, message) {
            const peerId = message.id || remoteId;
            const peerProfile = message.profile || { nick: dict[currentLang].guest, color: '#ffffff', avatar: '' };

            if (myProfile.isAdmin && message.type === 'join') {
                if (bannedDevices[message.profile?.deviceId]) {
                    sendToPeer(peerId, { type: 'banned_reject', target: peerId, senderName: myProfile.nick });
                    return;
                }
            }

            if (myProfile.isAdmin && message.type === 'ban_appeal') {
                if (ignoredAppeals[message.deviceId]) return; 
                const notifId = `appeal-${message.deviceId}`; 
                if (document.getElementById(notifId)) return; 
                const notif = document.createElement('div'); notif.id = notifId; notif.className = 'appeal-card';

                document.getElementById('admin-notifications').appendChild(notif); return;
            }

            if (message.type === 'banned_reject' && message.target === myId) {
                localStorage.setItem('voiceup_banned', 'true');
                showBannedScreen();
                return;
            }

            if (message.type === 'admin_kick') {
                if (message.target === myId) {
                    localStorage.setItem('voiceup_banned', 'true');
                    broadcastSignaling({ type: 'leave', id: myId });
                    showBannedScreen();
                } else {
                    const cardExists = !!document.getElementById(`card-${message.target}`);
                    removeUserCard(message.target);
                    if (cardExists) playUiSound('leave');
                }
                return;
            }

            if (message.type === 'appeal_accepted' && message.target === myId) {
                localStorage.removeItem('voiceup_banned');
                alert(dict[currentLang].adminAllowed);
                window.location.reload();
                return;
            }

            if (!localStream) return;

            if (message.type === 'leave') {
                const cardExists = !!document.getElementById(`card-${peerId}`);
                removeUserCard(peerId);
                if (activeCalls[peerId]) { activeCalls[peerId].close(); delete activeCalls[peerId]; }

                userStates[peerId] = message.state || {mic: true, deaf: false, adminMuted: false};
                updateCardVisuals(peerId, peerProfile, false);

                    profile: myProfile, 
                    state: userStates[myId],
                    peerList: isRoomHost ? Object.keys(activeConnections).filter(k => k !== peerId) : []

                updateCardVisuals(peerId, peerProfile, false);

                            connectDataToPeer(otherId);
                        }

        function setupSpeakingDetector(peerId, stream) {

                const analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;

                const data = new Uint8Array(analyser.frequencyBinCount);

                const checkVoice = () => {
                    const card = document.getElementById(`card-${peerId}`);
                    if (!card) return;
                    analyser.getByteFrequencyData(data);
                    let sum = 0;
                    for (let i = 0; i < data.length; i++) sum += data[i];
                    let avg = sum / data.length;
                    const avatar = card.querySelector('.avatar');
                    if (avatar) {
                        if (avg > 14) avatar.classList.add('speaking');
                        else avatar.classList.remove('speaking');
                    }
                    requestAnimationFrame(checkVoice);
                };

            } catch(e) {}
        }

            }

        cancelProfileBtn.onclick = () => { profileModal.style.display = 'none'; avatarInput.value = ""; };
        
        resetProfileBtn.onclick = () => {
            myProfile.color = "#ffffff"; myProfile.avatar = ""; colorInput.value = "#ffffff"; avatarPreview.src = ""; avatarPreview.style.display = 'none'; avatarUploadText.style.display = 'block'; removeAvatarBtn.style.display = 'none'; avatarInput.value = ""; 
            localStorage.setItem('voiceup_profile', JSON.stringify(myProfile)); profileBtn.innerHTML = `👤`; updateCardVisuals(myId, myProfile, true); 
            broadcastSignaling({ type: 'update-profile', id: myId, profile: myProfile });
            profileModal.style.display = 'none';
        };

        saveProfileBtn.onclick = () => {
            myProfile.color = colorInput.value; myProfile.avatar = (avatarPreview.style.display === 'block') ? avatarPreview.src : "";
            localStorage.setItem('voiceup_profile', JSON.stringify(myProfile)); profileModal.style.display = 'none';
            profileBtn.innerHTML = myProfile.avatar ? `<img src="${myProfile.avatar}">` : `👤`; updateCardVisuals(myId, myProfile, true); 
            broadcastSignaling({ type: 'update-profile', id: myId, profile: myProfile });
        };

        window.changeLocalVolume = (id, vol) => { 
            if (!localPeerSettings[id]) localPeerSettings[id] = { volume: 1, muted: false }; 
            localPeerSettings[id].volume = parseFloat(vol); 
            const audio = document.getElementById(`audio-${id}`);
            if (audio && !localPeerSettings[id].muted) audio.volume = parseFloat(vol);
        };
        
        window.toggleLocalMute = (id) => { 
            if (!localPeerSettings[id]) localPeerSettings[id] = { volume: 1, muted: false }; 
            localPeerSettings[id].muted = !localPeerSettings[id].muted; 
            const audio = document.getElementById(`audio-${id}`);
            if (audio) audio.volume = localPeerSettings[id].muted ? 0 : localPeerSettings[id].volume;
            updateCardVisuals(id, userProfiles[id], false); 
        };

        window.sendAdminAction = (action, targetId) => {
            if (!myProfile.isAdmin) return; 
            const targetDeviceId = userProfiles[targetId]?.deviceId || 'unknown';
            if (action === 'kick') { 
                bannedDevices[targetDeviceId] = true; localStorage.setItem('voiceup_banned_devices', JSON.stringify(bannedDevices)); 
                const cardExists = !!document.getElementById(`card-${targetId}`); removeUserCard(targetId); 
                if (cardExists) playUiSound('leave'); 
            }
            broadcastSignaling({ type: `admin_${action}`, target: targetId, senderName: myProfile.nick });
            toggleCardMenu(targetId); 
        };
        
        window.toggleAdminMute = (targetId) => { 
            const isServerMuted = userStates[targetId] && userStates[targetId].adminMuted; 
            sendAdminAction(isServerMuted ? 'unmute' : 'mute', targetId); 
        };

        function broadcastStatus() { 
            const actualMic = micEnabled && !adminMuted; 
            userStates[myId] = { mic: actualMic, deaf: !soundEnabled, adminMuted: adminMuted }; 
            updateCardVisuals(myId, myProfile, true); 
            broadcastSignaling({ type: 'status', id: myId, state: userStates[myId] });
        }
        
        function updateMicHardware() { 
            if (!localStream) return; 
            const actualMic = micEnabled && !adminMuted; 
            localStream.getAudioTracks()[0].enabled = actualMic; 
            micBtn.classList.toggle('off', !actualMic); 
            broadcastStatus(); 
        }
        
        function toggleMic() { 
            if (!localStream) return; 
            if (adminMuted) { alert(dict[currentLang].adminMutedAlert); return; } 
            micEnabled = !micEnabled; playUiSound(micEnabled ? 'mic_on' : 'mic_off'); updateMicHardware(); 
        }
        
        function toggleDeafen() { 
            soundEnabled = !soundEnabled; 
            document.querySelectorAll('#webrtc-audio-container audio').forEach(a => a.muted = !soundEnabled);
            deafenBtn.classList.toggle('off', !soundEnabled); playUiSound(soundEnabled ? 'deafen_off' : 'deafen_on'); broadcastStatus(); 
        }

        micBtn.onclick = toggleMic; deafenBtn.onclick = toggleDeafen;
        
        micHotkeyBtn.onclick = () => { 
            if (isAssigningMicHotkey) { isAssigningMicHotkey = false; micHotkeyBtn.classList.remove('listening'); updateHotkeysUI(); return; } 
            isAssigningMicHotkey = true; isAssigningDeafenHotkey = false; micHotkeyBtn.classList.add('listening'); deafenHotkeyBtn.classList.remove('listening'); updateHotkeysUI(); 
        };
        deafenHotkeyBtn.onclick = () => { 
            if (isAssigningDeafenHotkey) { isAssigningDeafenHotkey = false; deafenHotkeyBtn.classList.remove('listening'); updateHotkeysUI(); return; } 
            isAssigningDeafenHotkey = true; isAssigningMicHotkey = false; deafenHotkeyBtn.classList.add('listening'); micHotkeyBtn.classList.remove('listening'); updateHotkeysUI(); 
        };

        function leaveRoom() { 
            broadcastSignaling({ type: 'leave', id: myId });
            if (localStream) localStream.getTracks().forEach(track => track.stop()); 
            document.getElementById('room-screen').innerHTML = ''; 
            window.location.href = window.location.pathname; 
        }
        
        disconnectBtn.onclick = leaveRoom; 
        window.addEventListener('beforeunload', () => { broadcastSignaling({ type: 'leave', id: myId }); });
        
        window.addEventListener('keydown', (e) => { 
            if (isAssigningMicHotkey) { micHotkey = formatKey(e.key); if (micHotkey) localStorage.setItem('voiceup_hotkey', micHotkey); isAssigningMicHotkey = false; micHotkeyBtn.classList.remove('listening'); updateHotkeysUI(); e.preventDefault(); return; } 
            if (isAssigningDeafenHotkey) { deafenHotkey = formatKey(e.key); if (deafenHotkey) localStorage.setItem('voiceup_deafen_hotkey', deafenHotkey); isAssigningDeafenHotkey = false; deafenHotkeyBtn.classList.remove('listening'); updateHotkeysUI(); e.preventDefault(); return; } 
            if (document.activeElement.tagName === 'INPUT') return; 
            const pressedKey = formatKey(e.key); 
            if (micHotkey && pressedKey === micHotkey) { toggleMic(); e.preventDefault(); } 
            if (deafenHotkey && pressedKey === deafenHotkey) { toggleDeafen(); e.preventDefault(); } 
        });
        
        chatBtn.onclick = () => { chatOpen = true; chatPanel.classList.add('open'); chatBadge.style.display = 'none'; chatInput.focus(); };
        closeChatBtn.onclick = () => { chatOpen = false; chatPanel.classList.remove('open'); };
        chatPanel.onclick = (e) => { if (e.target === chatPanel) closeChatBtn.onclick(); };

        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
        
        function appendChatMessage(id, msgObj) {
            const msgDiv = document.createElement('div'); msgDiv.className = 'chat-msg'; 
            const profile = id === myId ? myProfile : (userProfiles[id] || {nick: dict[currentLang].guest, color: '#ffffff'}); 
            let contentHtml = '';
            if (msgObj.type === 'text') { contentHtml = `<span>${escapeHTML(msgObj.text)}</span>`; } 
            else if (msgObj.type === 'file') { 
                if (msgObj.mime.startsWith('image/')) contentHtml = `<img src="${msgObj.data}" class="chat-img" alt="${escapeHTML(msgObj.name)}">`; 
                else contentHtml = `<a href="${msgObj.data}" download="${escapeHTML(msgObj.name)}" class="chat-file">📎 ${escapeHTML(msgObj.name)}</a>`; 
            }
            msgDiv.innerHTML = `<b style="color:${profile.color}">${escapeHTML(profile.nick)}</b>: ${contentHtml}`; 
            document.getElementById('chat-messages').appendChild(msgDiv); document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
        }
        
        function handleIncomingMessage(peerId, msgObj) { 
            appendChatMessage(peerId, msgObj); if (!chatOpen) chatBadge.style.display = 'block'; playUiSound('chat_msg'); 
        }

        chatSend.onclick = () => { 
            const text = chatInput.value.trim(); if (!text) return; 
            chatInput.value = ''; const msgObj = { type: 'text', text: text }; 
            broadcastSignaling({ type: 'chat', id: myId, data: msgObj });
            appendChatMessage(myId, msgObj); 
        }; 
        chatInput.onkeydown = (e) => { if (e.key === 'Enter') chatSend.onclick(); };
        
        chatFileInput.onchange = (e) => { 
            const file = e.target.files[0]; if (!file) return; 
            if (file.size > 5 * 1024 * 1024) { alert(dict[currentLang].fileTooBig); e.target.value = ''; return; } 
            const reader = new FileReader(); 
            reader.onload = (event) => { 
                const msgObj = { type: 'file', name: file.name, mime: file.type, data: event.target.result }; 
                broadcastSignaling({ type: 'chat', id: myId, data: msgObj });
                appendChatMessage(myId, msgObj); 
            }; 
            reader.readAsDataURL(file); e.target.value = ''; 
        };

        function startLocalSpeakingDetector() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const micNode = audioCtx.createMediaStreamSource(localStream);
            const processorNode = audioCtx.createScriptProcessor(2048, 1, 1);
            micNode.connect(processorNode);

            processorNode.onaudioprocess = (e) => {
                const actualMic = micEnabled && !adminMuted;
                if (!actualMic) return;

                const inputData = e.inputBuffer.getChannelData(0);
                let sum = 0;
                for(let i=0; i<inputData.length; i++) sum += inputData[i] * inputData[i];
                let rms = Math.sqrt(sum / inputData.length);

                if (rms >= 0.015) {
                    if (!isSpeaking) {
                        isSpeaking = true;
                        const myCard = document.getElementById(`card-${myId}`);
                        if (myCard) myCard.querySelector('.avatar').classList.add('speaking');
                    }
                    clearTimeout(speakTimeout);
                    speakTimeout = setTimeout(() => {
                        isSpeaking = false;
                        const myCard = document.getElementById(`card-${myId}`);
                        if (myCard) myCard.querySelector('.avatar').classList.remove('speaking');
                    }, 400);
                }
            };

            const dummyGain = audioCtx.createGain();
            dummyGain.gain.value = 0;
            processorNode.connect(dummyGain);
            dummyGain.connect(audioCtx.destination);
        }

        function getColor(id) { let hash = 0; for (let i = 0; i < id.length; i++) hash = id.charCodeAt(i) + ((hash << 5) - hash); return `hsl(0, 0%, ${30 + (Math.abs(hash) % 30)}%)`; }
        window.toggleCardMenu = function(id) { document.querySelectorAll('.card-dropdown').forEach(menu => { if (menu.id !== `menu-${id}`) menu.classList.remove('open'); }); const menu = document.getElementById(`menu-${id}`); if (menu) menu.classList.toggle('open'); };
        document.addEventListener('click', (e) => { if (!e.target.closest('.user-card')) { document.querySelectorAll('.card-dropdown').forEach(menu => menu.classList.remove('open')); } });

        function addUserCard(id, profile, isMe) {
            Object.keys(userProfiles).forEach(existingId => {
                if (existingId !== id && userProfiles[existingId].deviceId === profile.deviceId) {
                    removeUserCard(existingId);
                    delete userProfiles[existingId];
                    delete userStates[existingId];
                }
            });

            const isNew = !document.getElementById(`card-${id}`); userProfiles[id] = profile; 
            if(!userStates[id]) userStates[id] = { mic: true, deaf: false, adminMuted: false }; 
            if(!localPeerSettings[id]) localPeerSettings[id] = { volume: 1, muted: false };
            updateCardVisuals(id, profile, isMe); 
            if (isNew && !isMe) setTimeout(() => playUiSound('join'), 500);
        }

        function updateCardVisuals(id, profile, isMe) {
            let card = document.getElementById(`card-${id}`); 
            const state = userStates[id] || { mic: true, deaf: false, adminMuted: false }; 
            if(!card) {
                card = document.createElement('div'); card.className = 'user-card'; card.id = `card-${id}`;
                card.innerHTML = `<div class="avatar"></div><div class="user-name"><span class="nick-text"></span><span class="is-me-badge"></span></div><div class="user-status"><span class="status-text"></span><div class="status-icons"></div></div>
                    ${!isMe ? `<button class="card-menu-btn" onclick="toggleCardMenu('${id}')" title="Настройки"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></button>
                    <div class="card-dropdown" id="menu-${id}"><div class="trans-local-sound" style="font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">${dict[currentLang].localSound}</div><div class="local-controls"><button class="loc-mute-btn" title="Локальный мут"></button><input type="range" class="loc-vol" min="0" max="1" step="0.05" title="Громкость"></div><div class="admin-controls" style="display:none;"><div class="trans-admin-panel" style="font-size: 11px; color: var(--danger); margin-bottom: 4px;">${dict[currentLang].adminPanel}</div><button class="admin-btn admin-mute-btn" onclick="toggleAdminMute('${id}')">${state.adminMuted ? dict[currentLang].unmuteMic : dict[currentLang].muteMic}</button><button class="admin-btn danger trans-kick" onclick="sendAdminAction('kick', '${id}')">${dict[currentLang].kick}</button></div></div>` : ''}`;
                roomScreen.appendChild(card); 
                if (!isMe) { card.querySelector('.loc-vol').oninput = (e) => changeLocalVolume(id, e.target.value); card.querySelector('.loc-mute-btn').onclick = () => toggleLocalMute(id); }
            }
            
            const locSet = localPeerSettings[id] || { volume: 1, muted: false }; const nick = profile.nick || dict[currentLang].guest; const color = profile.color || '#ffffff'; const bgColor = getColor(id); const initial = nick.substring(0, 2); const avatarHtml = profile.avatar ? `<img src="${profile.avatar}">` : initial;
            card.querySelector('.avatar').style.backgroundColor = bgColor; card.querySelector('.avatar').innerHTML = avatarHtml; card.querySelector('.nick-text').innerText = nick; card.querySelector('.user-name').style.color = color;
            const adminBadge = profile.isAdmin ? svgAdmin : ''; card.querySelector('.is-me-badge').innerHTML = (isMe ? dict[currentLang].you : '') + adminBadge; card.querySelector('.status-text').innerText = dict[currentLang].online;
            let iconsHtml = ''; if (!state.mic) iconsHtml += badgeMicOff; if (state.deaf) iconsHtml += badgeDeafOff; card.querySelector('.status-icons').innerHTML = iconsHtml;
            
            if (!isMe) {
                card.querySelector('.loc-vol').value = locSet.volume; card.querySelector('.loc-mute-btn').innerHTML = locSet.muted ? svgLocMute : svgLocUnmute; card.querySelector('.loc-mute-btn').className = `loc-mute-btn ${locSet.muted ? 'muted' : ''}`;
                if (myProfile.isAdmin) card.querySelector('.admin-controls').style.display = 'flex'; 
                const adminMuteBtn = card.querySelector('.admin-mute-btn'); if (adminMuteBtn) adminMuteBtn.innerText = state.adminMuted ? dict[currentLang].unmuteMic : dict[currentLang].muteMic; 
            }
        }

        function removeUserCard(id) { const card = document.getElementById(`card-${id}`); if(card) card.remove(); }
        function showBannedScreen() { if (localStream) localStream.getTracks().forEach(t => t.stop()); joinScreen.style.display = 'none'; roomScreen.style.display = 'none'; controlsPanel.style.display = 'none'; chatPanel.classList.remove('open'); bannedScreen.style.display = 'flex'; }

        document.getElementById('appealBtn').onclick = () => {
            const nick = elInput.value.trim() || myProfile.nick || dict[currentLang].guest; 
            broadcastSignaling({ type: 'ban_appeal', id: myId, nick: nick, deviceId: myProfile.deviceId });
            document.getElementById('appealBtn').innerText = dict[currentLang].reqSent; document.getElementById('appealBtn').disabled = true; document.getElementById('appealBtn').style.opacity = '0.5';
        };

        window.acceptAppeal = (targetId, deviceId) => {
            delete bannedDevices[deviceId]; localStorage.setItem('voiceup_banned_devices', JSON.stringify(bannedDevices));
            const notif = document.getElementById(`appeal-${deviceId}`); if (notif) notif.remove(); 
            broadcastSignaling({ type: 'appeal_accepted', target: targetId });
        };
        
        window.ignoreAppeal = (deviceId) => { ignoredAppeals[deviceId] = true; localStorage.setItem('voiceup_ignored_appeals', JSON.stringify(ignoredAppeals)); const notif = document.getElementById(`appeal-${deviceId}`); if (notif) notif.remove(); };

        elBtn.onclick = async () => {
            if (localStorage.getItem('voiceup_banned') === 'true') { return showBannedScreen(); }
            const inputVal = elInput.value.trim(); if (!inputVal) return alert(dict[currentLang].needNick);
            
            myProfile.nick = inputVal; localStorage.setItem('voiceup_profile', JSON.stringify(myProfile));
            
            try {
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume(); 
                }
                
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true, 
                        noiseSuppression: true, 
                        autoGainControl: true,
                        googEchoCancellation: true,
                        googNoiseSuppression: true
                    }, 
                    video: false 
                });
                
                joinScreen.style.opacity = '0';
                setTimeout(() => { 
                    joinScreen.style.display = 'none'; roomScreen.style.opacity = '1'; profileBtn.style.display = 'flex'; inviteBox.style.display = 'block'; controlsPanel.style.display = 'flex'; updateHotkeysUI(); 
                    if(myProfile.avatar) profileBtn.innerHTML = `<img src="${myProfile.avatar}">`; 
                }, 400);
                
                userStates[myId] = { mic: micEnabled, deaf: !soundEnabled, adminMuted: adminMuted }; 
                addUserCard(myId, myProfile, true);
                
                initPeerEngine();
                startLocalSpeakingDetector();
            } catch (err) { 
                console.error("Ошибка при входе:", err);
                alert(dict[currentLang].needMic + "\nПодробности для дебага: " + err.message); 
            }
        };

        // Запуск языковой локализации по умолчанию
        setLanguage('ru');
    </script>
</body>
</html>
